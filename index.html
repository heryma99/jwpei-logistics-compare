    const rawDest = (c.dest||[]).map(x=>x.trim());

      fees: declareFee>0 ? [{name:'清关费', type:'fixed', value:declareFee}] : [],

   }catch(e){ console.error('[syncTob] 渠道解析失败，已跳过:', c&&c.id, e); return null; }

const COUNTRY_ALIAS = {
  '沙特阿拉伯':'沙特','沙特':'沙特阿拉伯',
  '阿拉伯联合酋长国':'阿联酋','阿联酋':'阿拉伯联合酋长国',
  '美国':'美','美':'美国',

  '新西兰':'纽西兰','纽西兰':'新西兰',
  '韩国':'南韩','南韩':'韩国',
};
function findCountryWithAlias(countryMap, destCn){
  if(!destCn) return {};
  if(countryMap[destCn] && Object.keys(countryMap[destCn]).length) return countryMap[destCn];
  // 尝试别名
  const alias = COUNTRY_ALIAS[destCn];
  if(alias && countryMap[alias] && Object.keys(countryMap[alias]).length) return countryMap[alias];
  // 尝试模糊匹配（如"沙特" vs "沙特阿拉伯"）
  for(const k of Object.keys(countryMap)){
    if(k && (k.includes(destCn) || destCn.includes(k))) return countryMap[k];
  }
  return {};
}

/* 物料主数据表：搜索 + 分页状态（2317 条不能一次性渲染，否则卡死） */
let ITEM_PAGE=1, ITEM_Q="";

/* ===================== 持久化 ===================== */
function loadState(){

function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ===================== 4 支柱归一内核（吸收自 logistics-compare-normalize） ===================== */
function volumeWeight(l,w,h,divisor){ return (l*w*h)/divisor; }
// P1-1 计费重规则：max / actual / vol / vol_if_2x_actual(体积重≥实重×2才计体积重，云途加拿大新西兰)
function chargeWeight(sw, vw, rule, rounding, minW){
  let cw = rule==="actual" ? sw : rule==="vol" ? vw : rule==="vol_if_2x_actual" ? (vw >= sw*2 ? vw : sw) : Math.max(sw, vw);
  cw = Math.ceil(cw/rounding - 1e-9) * rounding;          // 向上进位到 rounding（减1e-9修浮点，避免 0.728→0.729）
  if(cw < (minW||0)) cw = minW||0;
  return Math.max(cw, 0);
}
// channel-compare 重量段取档铁律：向上取「最小 up ≥ cw 的档」
function tierRate(tiers, cw){
  // 数据用 {up, rate, reg}（小包）或 {kg, rate}（B2B）—— 都按上界取
  const sorted = tiers.slice().sort((a,b)=>(a.up||a.kg||0)-(b.up||b.kg||0));
  let t = sorted.find(x=> (x.up!=null?x.up:x.kg) >= cw - 1e-9);
  if(!t) t = sorted[sorted.length-1];
  return t;
}
// 货运引擎：真 SKU ÷ divisor → 缴费重 → 全费用展开 = Landed Cost
// destCn: 中文目的国（用于 per-country divisor / 国家级附加费 / 国家级税费覆盖）；eurFx: EUR/CNY 汇率（默认取渠道 fx 或 7.8）
// 统一附加费金额解析：支持 数值(固定) / {per_kg} / {per_piece} / {per_shipment|per_ticket|per_event} / {per_item, free}，可带 min 保底
function surAmt(v, cw, units){
  if(v==null) return 0;
  if(typeof v==='number') return v;
  let base=0;
  if(v.per_piece!=null) base = v.per_piece * (units||1);
  else if(v.per_shipment!=null || v.per_ticket!=null || v.per_event!=null) base = (v.per_shipment!=null?v.per_shipment:(v.per_ticket!=null?v.per_ticket:v.per_event))||0;
  else if(v.per_kg!=null) base = v.per_kg * (cw||0);
  else if(v.per_item!=null) base = v.per_item * Math.max(0, (units||1) - (v.free||0));
  if(v.min!=null) base = Math.max(base, v.min);
  return base;
}
function computeFreight(ch, sku, units, destCn, eurFx, opts){
  opts = opts || {};
  const cargoType = opts.cargoType || sku.attr || '箱包皮革';
  const conservative = opts.conservative != null ? opts.conservative : (typeof document!=='undefined' && document.getElementById('conservativeMode')?.checked);
  const destIso = opts.destIso || (typeof CN2ISO==='object' && CN2ISO[destCn]) || destCn;
  const p = ch.pricing;
  const cm = ch.countryMap || {};
  const co = findCountryWithAlias(cm, destCn);
  const divisor = co.volumetric_divisor || p.divisor;
  const sw = sku.weight * units;
  const vw = volumeWeight(sku.l, sku.w, sku.h, divisor) * units;
  const effectiveRule = co.charge_rule || p.charge_rule;
  const effectiveMin  = co.min_charge_weight || p.min_charge_weight || 0;
  const cw = chargeWeight(sw, vw, effectiveRule, p.rounding, effectiveMin);
  let rate = tierRate(p.weight_tiers, cw).rate;
  let freight = rate * cw;
  let items = [{name:"基本运费("+rate+"/kg×"+cw+"kg)", amt:freight}];
  let total = freight;
  for(const f of (ch.fees||[])){
    let a = f.type==="fixed" ? f.value
          : f.type==="per_kg" ? f.value*cw
          : f.type==="pct_of_freight" ? freight*f.value
          : f.type==="pct_of_value" ? sku.decl*units*f.value : 0;
    if(a){ items.push({name:f.name, amt:a}); total+=a; }
  }
  if(p.fuel_pct){ const a=freight*p.fuel_pct; items.push({name:"燃油("+(p.fuel_pct*100)+"%)",amt:a}); total+=a; }
  // 国家级附加费（战争附加费 / 海关资料处理费 等，随渠道附在 country.add）
  const add = co.add || {};
  if(add.war_per_kg){ const a=add.war_per_kg*cw; items.push({name:"战争附加费("+add.war_per_kg+"/kg)",amt:a}); total+=a; }
  if(add.custom_per_shipment){ const a=add.custom_per_shipment; items.push({name:"海关资料处理费",amt:a}); total+=a; }
  // 国家级税费 VAT/DUTY（申报值×比例，如中东捷邮按目的国税率）
  const taxPct = co.tax || 0;
  if(taxPct){ const a=(sku.decl||0)*units*taxPct; items.push({name:"VAT/DUTY(申报值×"+(taxPct*100).toFixed(0)+"%)",amt:a}); total+=a; }
  // 欧盟：VAT + 代缴服务费(2%) + 3欧元/Item临时固定关税（云途欧盟路向）
  if(co.vat!=null){
    const fx = eurFx || p.fx || 7.8;
    const declVal=(sku.decl||0)*units;
    const vat=declVal*co.vat;
    const svc=declVal*(co.service_fee_pct||0);
    const duty=(co.duty_fixed_eur||0)*fx;
    items.push({name:`欧盟VAT(${(co.vat*100).toFixed(0)}%)`,amt:vat}); total+=vat;
    if(co.service_fee_pct){ items.push({name:`代缴服务费(${(co.service_fee_pct*100).toFixed(0)}%)`,amt:svc}); total+=svc; }
    if(co.duty_fixed_eur){ items.push({name:`临时关税(${co.duty_fixed_eur}EUR×${fx})`,amt:duty}); total+=duty; }
  }
  // 整渠道级 DDP/DDU 口径：DDP 含税跳过补税；DDU 按整渠道 duty_rate/vat_rate 补（绝大多数渠道这两项=0，税费已由国家字段承担）
  if(!p.tax_included && p.incoterm!=="DDP"){
    const duty = sku.decl*units*(p.duty_rate||0);
    const vat  = (sku.decl*units + freight + duty)*(p.vat_rate||0);
    if(duty){ items.push({name:"关税("+(p.duty_rate*100)+"%)",amt:duty}); total+=duty; }
    if(vat){ items.push({name:"VAT("+(p.vat_rate*100)+"%)",amt:vat}); total+=vat; }
  }
  // ★ 商业快递结构化附加费（来自中运通达/亚丰对账单真实收费口径）
  const sur = ch.sur;
  if(sur){
    // 清关费/报关费/关税预付（DDU/非包税才收；DDP 已含）
    if(sur.clearance && !p.tax_included){
      const cl = typeof sur.clearance==='object' ? (sur.clearance.per_shipment||0) : sur.clearance;
      if(cl){ items.push({name:`清关费/报关费(${cl}/票)`, amt:cl}); total+=cl; }
    }
    // 产品附加费（按货物类型 /kg）
    if(sur.product){
      const pr = (sur.product[cargoType]!=null?sur.product[cargoType]:(sur.product['普货']||0));
      if(pr){ const a=pr*cw; items.push({name:`产品附加费(${cargoType} ${pr}/kg × ${cw}kg)`, amt:a}); total+=a; }
    }
    // 磁检费（带电/带磁货物）
    if(sur.magnet && (sku.battery || /磁|电池/.test(cargoType||''))){
      const mg = typeof sur.magnet==='object' ? (sur.magnet.per_shipment||sur.magnet.per_ticket||0) : sur.magnet;
      if(mg){ items.push({name:`磁检费(${mg}/票)`, amt:mg}); total+=mg; }
    }
    // 高风险国家附加费（按目的国 /kg）
    if(sur.high_risk && destIso && sur.high_risk[destIso]){
      const hr = sur.high_risk[destIso]*cw;
      items.push({name:`高风险国家附加费(${destIso} ${sur.high_risk[destIso]}/kg × ${cw}kg)`, amt:hr}); total+=hr;
    }
    // 旺季/偏远/超长超重/改址/退件：完整预算（可能费用）模式才计入
    if(conservative){
      if(sur.peak){ const pk = typeof sur.peak==='object' ? (sur.peak.per_kg?sur.peak.per_kg*cw:(sur.peak.per_shipment||0)) : sur.peak; if(pk){ items.push({name:`旺季附加费`, amt:pk}); total+=pk; } }
      if(sur.remote){ const rm = surAmt(sur.remote, cw, units); if(rm){ items.push({name:`偏远附加费`, amt:rm}); total+=rm; } }
      if(sur.oversize){ const ov = surAmt(sur.oversize, cw, units); if(ov){ items.push({name:`超长超重附加费`, amt:ov}); total+=ov; } }
      if(sur.addr_change){ const ac = surAmt(sur.addr_change, cw, units); if(ac){ items.push({name:`更改地址费`, amt:ac}); total+=ac; } }
      if(sur.return){ const rt = surAmt(sur.return, cw, units); if(rt){ items.push({name:`退件费`, amt:rt}); total+=rt; } }
    }
  }
  total *= (p.fx||1);
  // ★ 完整预算：加偏远/磁检/商业清关等可能费用（RATES 渠道 surcharges，保守模式）
  if(conservative && ch.surcharges){
    const s=ch.surcharges;
    if(s.remote_per_shipment){ items.push({name:"偏远附加费(RMB/票)",amt:s.remote_per_shipment}); total+=s.remote_per_shipment; }
    if(s.magnetic_per_shipment && sku.battery){ items.push({name:"磁检费(RMB/票)",amt:s.magnetic_per_shipment}); total+=s.magnetic_per_shipment; }
    if(s.commercial_clearance_cad){ const v=s.commercial_clearance_cad*(p.fx||1); items.push({name:"商业清关费(上限)",amt:v}); total+=v; }
    if(s.remote_per_kg){ const v=Math.max(s.remote_per_kg*cw,s.remote_min||0); items.push({name:"偏远附加(估算/kg)",amt:v}); total+=v; }
    if(s.oversize_per_event){ items.push({name:"超尺寸附加费",amt:s.oversize_per_event}); total+=s.oversize_per_event; }
    if(s.heavy_per_event){ items.push({name:"超重附加费",amt:s.heavy_per_event}); total+=s.heavy_per_event; }
  }
  return {cw, items, total, transit:ch.decision?.transit};
}
// 资格校验（P2 硬约束）：派送对象匹配? 重量≤上限? 属性接受? audience 支持多值如["2B","2C"]
function qualify(ch, sku, units, audience, b2bType){
  const reasons=[];
  if(ch.audience && audience){
    const audList = Array.isArray(ch.audience) ? ch.audience : [ch.audience];
    if(!audList.includes(audience) && !audList.includes('2'+audience.slice(-1))) reasons.push("派送对象不符("+ch.audience+"≠"+audience+")");
  }
  if(ch.max_weight && (sku.weight*units) > ch.max_weight) reasons.push("超重("+(sku.weight*units)+"kg>"+ch.max_weight+"kg上限)");
  if(ch.accepted && !ch.accepted.includes(sku.attr)) reasons.push("属性不符("+sku.attr+"不被接受)");
  // 2B 类型细分：FBA/非FBA/商业地址
  if(audience==='2B' && b2bType && ch.b2bType && !ch.b2bType.includes(b2bType)) reasons.push("派送类型不符(渠道仅支持"+ch.b2bType.join('/')+")");
  return reasons;
}

function autoFillSku(i, sku){
  const g=GC[sku]; if(!g) return;
  const it=S.items[i]; if(!it) return;
  it.name=g.name||g.en_name||sku; it.l=+g.l||0; it.w=+g.w||0; it.h=+g.h||0; it.weight=+g.weight||0; it.attr=(+g.battery)?"带电":"普货"; it.hs=g.hs||"";
  rItems(); // 重渲染以显示带出值
}
/* S.items ∪ 谷仓字典（取并集，谷仓 SKU 可直接在货运/路由页选用） */
function combSkus(){
  const gcOnly=Object.values(GC).filter(g=> !S.items.find(x=>x.sku===g.sku));
  const extra=gcOnly.map(g=>({sku:g.sku,name:g.name||g.en_name||g.sku,l:+g.l||0,w:+g.w||0,h:+g.h||0,weight:+g.weight||0,decl:0,hs:g.hs||"",attr:(+g.battery)?"带电":"普货"}));
  return S.items.concat(extra);
}

    const eurFx=parseFloat($("#euFx")?.value)||7.8;

    // ② ③ ④ 通用:小包/快递/头程 预估+比价 共用

    function postcodeToRegion(zp){
      if(!zp) return '';
      const d = String(zp).trim().charAt(0);

          maybeItems:[], maybeTotal:0, totalWithMaybe:r.total||0

      }
      // ④ 头程(B2B):独立计算,完整费用展开
      const pickRegion=(reg)=> (reg && ch.regions?.[reg]?.tiers) ? reg : (ch.regions?.[destCn]?.tiers ? destCn : Object.keys(ch.regions||{})[0] || destCn);
      const finalRegion = regionOverride || pickRegion(detectedRegion);
      const co = ch.regions?.[finalRegion] || ch.regions?.[destCn] || Object.values(ch.regions||{})[0] || {};
      const sw=sku.weight*units, vw=volumeWeight(sku.l,sku.w,sku.h,ch.pricing.divisor||co.divisor||6000)*units;
      const bw=Math.max(sw,vw);
      const minpc = co.min_charge_weight || ch.sur?.minpc || 0;
      const totalBw=Math.max(bw, minpc);
      const tiers = (co.tiers || ch.pricing.weight_tiers || []).slice().sort((a,b)=>(a.min||a.kg||0)-(b.min||b.kg||0));
      let tier = tiers.find(t=>totalBw <= (t.min||t.kg||0));
      if(!tier) tier = tiers[tiers.length-1] || {min:0, rate:0};
      const rate = tier.rate;
      const base = rate*totalBw;
      const sur = co.sur || ch.sur || {};
      // ── 必收费用 ──
      const mustItems=[]; let mustTotal=0;
      mustItems.push({name:`基本运费 ${rate}/kg × ${totalBw.toFixed(2)}kg ${finalRegion!==destCn?'(分区:'+finalRegion+')':''}`, amt:base}); mustTotal+=base;
      if(ch.pricing.fuel_pct){ const a=base*ch.pricing.fuel_pct; mustItems.push({name:`燃油(${(ch.pricing.fuel_pct*100).toFixed(1)}%)`, amt:a}); mustTotal+=a; }
      const catRate = sur.cat ? (sur.cat[cargoType] || sur.cat['普货'] || 0) : 0;
      if(catRate){ const a=catRate*totalBw; mustItems.push({name:`品类附加(${cargoType} ${catRate}/kg × ${totalBw.toFixed(2)}kg)`, amt:a}); mustTotal+=a; }
      if(sur.nonfba){
        let nfbAmt=0, nfbLabel='';
        if(b2bAddrType==='FBA'){ nfbLabel='FBA 免收'; }
        else if(b2bAddrType==='非FBA'){ nfbAmt=sur.nonfba.per_kg?sur.nonfba.per_kg*totalBw:0; nfbLabel='非FBA商业地址'; if(nfbAmt===0)nfbLabel='非FBA免附加'; }
        else if(b2bAddrType==='住宅'){ nfbAmt=surAmt(sur.nonfba.residential, totalBw, units); nfbLabel='住宅地址'; }
        if(nfbAmt>0){ mustItems.push({name:`非FBA/住宅附加(${nfbLabel} ${nfbAmt.toFixed(2)})`, amt:nfbAmt}); mustTotal+=nfbAmt; }
      }
      if(sur.declare){   // 报关/清关操作费：真实账单对所有发货均收（包税渠道单票单件清关费），故 FBA/非FBA 都列
        if(typeof sur.declare==='object'){ const bf=sur.declare.base||0, op=(sur.declare.per_kg_op||0)*totalBw; mustItems.push({name:`报关/清关费(基础 ${bf}/票 + 操作 ${sur.declare.per_kg_op||0}/kg × ${totalBw.toFixed(2)}kg)`, amt:bf+op}); mustTotal+=bf+op; }
        else { mustItems.push({name:`报关/清关费(${sur.declare}/票)`, amt:sur.declare}); mustTotal+=sur.declare; }
      }
      if(sur.inspection){ const insp=sur.inspection; const ik=sur.inspection_kg?Math.max(totalBw,1):totalBw; const a=Math.max((insp.per_kg||0)*ik, insp.min||0); if(a>0){ mustItems.push({name:`商检费(${(insp.per_kg||0)}/kg, 最低${insp.min||0})`, amt:a}); mustTotal+=a; } }
      if(sur.magnetic){ const a=surAmt(sur.magnetic, totalBw, units); mustItems.push({name:`磁检费(${a.toFixed(2)})`, amt:a}); mustTotal+=a; }
      // ── 可能费用（实报实销/按发生）：始终计算并展示，但不计入基准到手成本 ──
      const maybeItems=[]; let maybeTotal=0;
      const addMaybe=(label, a)=>{ if(a>0){ maybeItems.push({name:label, amt:a}); maybeTotal+=a; } };
      if(sur.remote) addMaybe(`偏远附加费`, surAmt(sur.remote, totalBw, units));
      if(sur.over_items) addMaybe(`超品名附加费(超 ${Math.max(0,(units||1)-(sur.over_items.free||0))} 个品名 ×${sur.over_items.per_item})`, surAmt(sur.over_items, totalBw, units));
      if(sur.oversize && totalBw>=22.5) addMaybe(`超尺寸附加费(单件≥22.5kg)`, surAmt(sur.oversize, totalBw, units));
      if(sur.overweight && totalBw>=30) addMaybe(`超重附加费(单件≥30kg)`, surAmt(sur.overweight, totalBw, units));
      if(sur.addr_change) addMaybe(`更改地址费`, surAmt(sur.addr_change, totalBw, units));
      mustTotal *= (ch.pricing.fx||1); maybeTotal *= (ch.pricing.fx||1);
      const items = mustItems.concat(maybeItems);
      return {cw:totalBw, region:finalRegion, mustItems, mustTotal, maybeItems, maybeTotal, items, total:mustTotal, totalWithMaybe:mustTotal+maybeTotal, transit:ch.decision?.transit||10};
    };
    const estBlock=(r)=>{
      let h=`<table><thead><tr><th>科目（必收）</th><th>金额¥</th></tr></thead><tbody>`;
      r.mustItems.forEach(it=> h+=`<tr><td>${it.name}</td><td>${it.amt.toFixed(2)}</td></tr>`);
      h+=`<tr class="best"><td>基准到手总成本（必收）</td><td>¥${r.mustTotal.toFixed(2)}</td></tr></tbody></table>`;
      if(r.maybeItems.length){
        h+=`<table style="margin-top:8px"><thead><tr><th>可能附加（实报实销/按发生）</th><th>金额¥</th></tr></thead><tbody>`;
        r.maybeItems.forEach(it=> h+=`<tr><td>${it.name}</td><td>${it.amt.toFixed(2)}</td></tr>`);
        h+=`<tr class="warn"><td>含可能附加上限</td><td>¥${r.totalWithMaybe.toFixed(2)}</td></tr></tbody></table>`;
      }
      return h;
    };
    if(mode==="estimate"){
      const pickHtml=`<label>选渠道</label><select id="estCh">${eligible.map((c,i)=>`<option value="${i}">${c.carrier}·${c.channel}</option>`).join('')}</select>`;
      const chIdx=Math.min(eligible.length-1, +($("#estCh")?.value||0));
      const ch=eligible[chIdx];
      let body='';
      if(isUS3(ch)){
        body = usRegions.map(reg=>{ const r=computeAll(ch, reg); return `<h4 class="reg-h">${reg} 区（邮编识别）· 基准 ¥${r.mustTotal.toFixed(2)}${r.maybeTotal>0?` ＋可能 ¥${r.maybeTotal.toFixed(2)}`:''}</h4>`+estBlock(r); }).join('');
      } else {
        const r=computeAll(ch);
        body = `<h4 class="reg-h">到手总成本 基准 ¥${r.mustTotal.toFixed(2)}${r.maybeTotal>0?` ＋可能 ¥${r.maybeTotal.toFixed(2)}`:''}</h4>`+estBlock(r);
      }
      const cw=(isUS3(ch)?computeAll(ch, detectedRegion||'美西').cw:computeAll(ch).cw);
      out+=`<h3>预估明细 · ${ch.carrier}·${ch.channel}</h3>${pickHtml}${body}
        <div class="mut">缴费重 ${cw.toFixed(2)}kg（实重${(sku.weight*units).toFixed(2)} / 体积重${(volumeWeight(sku.l,sku.w,sku.h,ch.pricing.divisor)*units).toFixed(2)} ÷${ch.pricing.divisor}）· 时效约 ${ch.decision?.transit||10} 天</div>
        <div class="mut" style="margin-top:8px;line-height:1.6">
          <b>✓ 必收：</b>基本运费 + 燃油 + 品类附加（按货物类型）+ 非FBA/住宅附加 + 报关费（非FBA）+ 商检 + 磁检<br>
          <b>⚠️ 可能附加（实报实销，按发生计，<u>不计入</u>基准）：</b>偏远 / 超品名 / 超尺寸 / 超重 / 更改地址；另有旺季附加、退件、仓租查验等未列
        </div>`;
      $("#fOut").innerHTML=out;
      const ec=document.getElementById('estCh'); if(ec) ec.onchange=()=>{ const i=+ec.value; const nch=eligible[i]; let nb=''; if(isUS3(nch)){ nb=usRegions.map(reg=>{const r=computeAll(nch,reg);return `<h4 class="reg-h">${reg} 区 · 基准 ¥${r.mustTotal.toFixed(2)}</h4>`+estBlock(r);}).join(''); } else { const r=computeAll(nch); nb=`<h4 class="reg-h">到手总成本 基准 ¥${r.mustTotal.toFixed(2)}</h4>`+estBlock(r); } const o2=`<h3>预估明细 · ${nch.carrier}·${nch.channel}</h3>${pickHtml}${nb}<div class="mut">缴费重 ${computeAll(nch).cw.toFixed(2)}kg · 时效约 ${nch.decision?.transit||10} 天</div>`; $("#fOut").innerHTML=o2; const e2=document.getElementById('estCh'); if(e2){e2.value=i; e2.onchange=arguments.callee;} };
      return;
    }
    // 比价：全候选排序（美国渠道并列展示美西/美中/美东三区价格）
    const res=eligible.map(ch=>{
      const r=computeAll(ch);
      let rt=null;
      if(isUS3(ch)){ rt = usRegions.map(reg=>({reg, t:computeAll(ch, reg).mustTotal})); }
      return {ch, r, rt};
    }).sort((a,b)=>a.r.mustTotal-b.r.mustTotal);
    const best=res[0].r.mustTotal;
    // ★ 美国三区列只在「头程(toB)」模块显示；小包/商业快递美国是单国（从国内直发），不拆分三区
    const usHeader = (CUR==='tob' && destIso==='US')?'<th>美西</th><th>美中</th><th>美东</th>':'';
    out+=`<h3>横向比价结果 · ${eligible.length} 个入围渠道（按到手总成本升序，绿色=最优）</h3>
      <div class="scroll-x"><table class="result-table"><thead><tr><th>#</th><th>物流商·渠道</th><th>可发国家</th><th>计费重</th><th class="price-cell">到手总成本</th><th>时效</th><th>vs 最优</th>${usHeader}</tr></thead><tbody>`;
    res.forEach((x,idx)=>{
      const cnList=x.ch.countries.map(isoToChinese);
      const cnShort=cnList.length>3?cnList.slice(0,3).join('、')+` 等${cnList.length}国`:cnList.join('、');
      const sw=(sku.weight*units).toFixed(2);
      const vw=(volumeWeight(sku.l,sku.w,sku.h,x.ch.pricing.divisor)*units).toFixed(2);
      const cwTip=`MAX(实重${sw}, 体积重${vw}) 向上进位到${x.ch.pricing.rounding}kg = ${x.r.cw}kg`;
      const diff = idx===0? `<span class="diff-badge best">★ 最优</span>` : `<span class="diff-badge">+¥${(x.r.mustTotal-best).toFixed(2)}</span>`;
      const usCells = x.rt ? x.rt.map(z=>`<td class="mut">¥${z.t.toFixed(0)}</td>`).join('') : ((CUR==='tob' && destIso==='US')?'<td class="mut">—</td><td class="mut">—</td><td class="mut">—</td>':'');
      out+=`<tr class="${idx===0?"best":""}">
        <td class="mut">${idx+1}</td>
        <td class="c-name"><b>${x.ch.carrier}</b><br><span class="mut">${x.ch.channel}</span></td>
        <td class="c-country mut" title="${cnList.join('、')}">${cnShort}</td>
        <td title="${cwTip}"><b>${x.r.cw.toFixed(2)}</b>kg<br><span class="mut">÷${x.ch.pricing.divisor}</span></td>
        <td class="price-cell">¥${x.r.mustTotal.toFixed(2)}</td>
        <td>${x.r.transit||'-'}天</td>
        <td>${diff}</td>
        ${usCells}
      </tr>`;
    });
    out+=`</tbody></table></div><div class="mut">* 计费重=MAX(实重,体积重)后进位；${CUR==='tob'&&destIso==='US'?'美国头程渠道按邮编自动识别美西/美中/美东三区；':''}DDP vs DDU、divisor 不同者口径仅供参考。</div>`;
    $("#fOut").innerHTML=out;
  };
  $("#skuSel").onchange=draw; $("#units").onchange=draw; $("#b2bType").onchange=draw; $("#acZip").oninput=draw; $("#cargoType").onchange=draw; $("#euFx").onchange=draw;
  document.querySelectorAll('input[name=mode]').forEach(r=> r.onchange=draw);
  $("#run").onclick=draw;
  bindCombo($("#dest"), $("#destList"), displayCountries, draw);
  draw();
}

/* ===================== ⑤ 海外仓（多操作，解耦/合并） ===================== */
function rOps(){
  const M=S.modules.overseas;
  let h=`<div class="card"><h2>⑤ 海外仓　<span class="pill">操作引擎 · 5 操作勾选=解耦/合并</span></h2>
    <div class="note">海外仓是多操作成本段：勾 1 项 = 解耦（单操作预算）；勾多项 = 合并（全流程预算）。这就是你要的「既能单独出某段、也能合成整体」。</div>
    <div id="opsOut"></div></div>`;
  $("#app").innerHTML=h;
  const ops=M.ops.map(o=>`<label><input type="checkbox" class="op" data-k="${o.op}" checked> ${o.op}(¥${o.rate}/${o.unit})</label>`).join("");
  const body=`<h3>操作勾选（解耦 ↔ 合并）</h3><div class="seg">${ops}</div>
    <label>入库箱数</label><input type="number" id="qBox" value="50">
    <label>月仓储 m³</label><input type="number" id="qM3" value="3">
    <label>订单数</label><input type="number" id="qOr" value="300">
    <label>退货数</label><input type="number" id="qRe" value="20">
    <button class="act" id="calcOps" style="margin-left:10px">算预算</button>
    <div id="opsRes"></div>`;
  $("#opsOut").innerHTML=body;
  $("#calcOps").onclick=()=>{
    const q={入库上架:+$("#qBox").value,仓储:+$("#qM3").value,拣货:+$("#qOr").value,发货:+$("#qOr").value,退货:+$("#qRe").value};
    let rows="", total=0;
    M.ops.forEach(o=>{
      const cb=document.querySelector('.op[data-k="'+o.op+'"]');
      if(cb.checked){ const amt=o.rate*q[o.op]; total+=amt; rows+=`<tr class="best"><td>${o.op}</td><td>${q[o.op]} ${o.unit}</td><td>¥${amt.toFixed(2)}</td></tr>`; }
    });
    $("#opsRes").innerHTML=`<table><thead><tr><th>已勾操作</th><th>数量</th><th>预算</th></tr></thead><tbody>${rows||'<tr><td colspan=3>未勾选任何操作</td></tr>'}<tr class="best"><td>合计预算</td><td></td><td>¥${total.toFixed(2)}</td></tr></tbody></table>
      <div class="mut">解耦：只勾「入库上架」→ 仅该段预算；合并：全勾 → 全流程总预算。后续把此段与「头程段」相加 = 整条链路总预算（见 ⑥）。</div>`;
  };
}

/* ===================== ⑥ 全链路路由（P0-1 串联） ===================== */
function rRoute(){
  const tob=S.modules.tob, ov=S.modules.overseas;
  let h=`<div class="card"><h2>⑥ 全链路路由　<span class="pill">P0-1 修复 · 成本对象串联</span></h2>
    <div class="note">一次发货 = 一个成本对象（cost object）。选 SKU 自动带出 → 选头程渠道 → 勾选海外仓操作。系统既能<b>解耦</b>出「仅头程」或「仅海外仓」段预算，也能<b>合并</b>成整条链路总预算。各段成本都挂在同一个 SKU 上，可回推每 SKU 到手总成本（你要的全链路解耦+合并）。</div>
    <div id="rtOut"></div></div>`;
  $("#app").innerHTML=h;
  const skuList=combSkus();
  const skuOpts=`<input id="rtSku" list="gcList" style="min-width:220px" value="${(skuList[0]||{}).sku||''}"><datalist id="gcList">${skuList.map(it=>`<option value="${it.sku}">${it.sku} · ${it.name}</option>`).join("")}</datalist>`;
  const tobOpts=tob.carriers.filter(c=>c.countries.includes("DE")).map((c,i)=>`<option value="${i}">${c.carrier}·${c.channel}</option>`).join("");
  const ops=ov.ops.map(o=>`<label><input type="checkbox" class="rtop" data-k="${o.op}"> ${o.op}</label>`).join("");
  const body=`<h3>发货单（成本对象）</h3>
    SKU ${skuOpts}
    件数 <input type="number" id="rtUnits" value="1">
    头程渠道(DE) <select id="rtTob">${tobOpts}</select>
    <h3>海外仓段操作（勾选=并入全链路）</h3><div class="seg">${ops}</div>
    入库箱数 <input type="number" id="rtBox" value="50">　订单数 <input type="number" id="rtOr" value="300">　退货数 <input type="number" id="rtRe" value="20">　月仓储m³ <input type="number" id="rtM3" value="3">
    <button class="act" id="rtCalc" style="margin-left:10px">算全链路</button>
    <div id="rtRes"></div>`;
  $("#rtOut").innerHTML=body;
  $("#rtCalc").onclick=()=>{
    const units=+$("#rtUnits").value, ti=+$("#rtTob").value;
    const sku=combSkus().find(x=>x.sku===$("#rtSku").value); const ch=tob.carriers.filter(c=>c.countries.includes("DE"))[ti];
    if(!sku){ $("#rtRes").innerHTML='<div class="err">未找到 SKU，请在 ① 物料主数据输入/引用谷仓编码</div>'; return; }
    const fr=computeFreight(ch, sku, units);   // 头程段
    // 海外仓段
    const q={入库上架:+$("#rtBox").value,仓储:+$("#rtM3").value,拣货:+$("#rtOr").value,发货:+$("#rtOr").value,退货:+$("#rtRe").value};
    let ovRows="", ovTotal=0, anyOv=false;
    ov.ops.forEach(o=>{ const cb=document.querySelector('.rtop[data-k="'+o.op+'"]'); if(cb.checked){ anyOv=true; const amt=o.rate*q[o.op]; ovTotal+=amt; ovRows+=`<tr><td>${o.op}</td><td>¥${amt.toFixed(2)}</td></tr>`; } });
    const merged = fr.total + ovTotal;
    let out=`<h3>解耦视图</h3>
      <table><thead><tr><th>段</th><th>预算¥</th></tr></thead><tbody>
      <tr><td>头程（${ch.carrier}·${ch.channel} · ${fr.cw}kg）</td><td>${fr.total.toFixed(2)}</td></tr>
      <tr><td>海外仓段${anyOv?"":"（未勾选操作）"}</td><td>${ovTotal.toFixed(2)}</td></tr></tbody></table>`;
    if(anyOv) out+=`<table style="margin-top:8px"><thead><tr><th>海外仓操作明细</th><th>预算</th></tr></thead><tbody>${ovRows}</tbody></table>`;
    out+=`<h3 class="ok">合并总预算（全链路）</h3>
      <div style="font-size:22px;font-weight:800;color:var(--green)">¥${merged.toFixed(2)}</div>
      <div class="mut">= 头程 ¥${fr.total.toFixed(2)} + 海外仓 ¥${ovTotal.toFixed(2)}。各环节成本都挂在 SKU「${sku.sku}」上，可继续回推每 SKU 到手总成本 / 毛利（反向云，v1 已支持思路，本 demo 聚焦骨架）。</div>`;
    $("#rtRes").innerHTML=out;
  };
}

/* ===================== ⑦ 环比（P0-3 多期版本） ===================== */
function rMom(){
  const mods=Object.keys(S.modules).filter(k=>S.modules[k].engine==="freight");
  let h=`<div class="card"><h2>⑦ 环比分析　<span class="pill">P0-3 修复 · 费率多期版本</span></h2>
    <div class="note">只做<b>环比</b>（本期 vs 上期），不做同比。每个渠道费率带 <b>history 多期版本</b>（生效日 + 阶梯单价），不再是只有两期。默认基准 = <b>最新 vs 次新</b>，红=涨、绿=跌（中国习惯）。</div>
    <label>模块</label><select id="mMod">${mods.map(k=>`<option value="${k}">${S.modules[k].name}</option>`).join("")}</select>
    目的国 <select id="mDest"></select>
    <button class="act" id="mRun" style="margin-left:8px">看环比</button>
    <div id="mOut"></div></div>`;
  $("#app").innerHTML=h;
  const fillDest=()=>{ const M=S.modules[$("#mMod").value]; $("#mDest").innerHTML=uniq(M.carriers.flatMap(c=>c.countries)).map(c=>`<option>${c}</option>`).join(""); };
  $("#mMod").onchange=fillDest; fillDest();
  $("#mRun").onclick=()=>{
    const M=S.modules[$("#mMod").value], dest=$("#mDest").value;
    const carriers=M.carriers.filter(c=>c.countries.includes(dest) && c.history && c.history.length>=2);
    if(!carriers.length){ $("#mOut").innerHTML=`<div class="mut">该模块「${dest}」暂无可环比渠道（需 ≥2 期 history）。</div>`; return; }
    let out=`<h3>${M.name} · ${dest} · 环比（最新 vs 次新）</h3>`;
    carriers.forEach(ch=>{
      const h=ch.history.slice().sort((a,b)=>a.date<b.date?1:-1); // 新→旧
      const cur=h[0], prev=h[1];
      out+=`<div style="margin:10px 0"><b>${ch.carrier}·${ch.channel}</b> <span class="mut">(${prev.date} → ${cur.date})</span></div><table><thead><tr><th>重量段上限kg</th><th>上期¥/kg</th><th>本期¥/kg</th><th>Δ元</th><th>方向</th></tr></thead><tbody>`;
      const merged=uniq([...cur.tiers,...prev.tiers].map(t=>t.kg)).sort((a,b)=>a-b);
      merged.forEach(kg=>{
        const a=(prev.tiers.find(t=>t.kg===kg)||{}).rate, b=(cur.tiers.find(t=>t.kg===kg)||{}).rate;
        if(a==null||b==null){ out+=`<tr><td>${kg}</td><td>${a??"—"}</td><td>${b??"—"}</td><td colspan=2 class="mut">仅一期有</td></tr>`; return; }
        const d=b-a, cls=d>0?"up":(d<0?"down":"mut");
        out+=`<tr><td>${kg}</td><td>${a}</td><td>${b}</td><td class="${cls}">${d>0?"+":""}${d}</td><td class="${cls}">${d>0?"▲ 涨":"▼ 跌"}</td></tr>`;
      });
      out+=`</tbody></table>`;
    });

  // ---- 引擎（与独立验证版一致） ----
  function findBracket(br,w){ for(const b of br){ if(w<=b.up) return b; } return br[br.length-1]; }
  function findTier(tiers,w){ if(!tiers||!tiers.length) return null; let last=null; for(const t of tiers){ if(w>=t.min) last=t; else break; } return last; }
  function countryToZone(ch,country){
    for(let zi=0;zi<ch.zones.length;zi++){ const parts=ch.zones[zi].countries.split(/[、,，\s]+/).filter(x=>x.trim()); if(parts.includes(country)) return zi; }
    if(country==='美国'){ for(let zi=0;zi<ch.zones.length;zi++){ const parts=ch.zones[zi].countries.split(/[、,，\s]+/).filter(x=>x.trim()); if(parts.some(p=>p.startsWith('美'))) return zi; } }
    if(country==='加拿大'){ for(let zi=0;zi<ch.zones.length;zi++){ const c=ch.zones[zi].countries; if(c.includes('加墨')||c.includes('加拿大')) return zi; } }
    return null;
  }
  function matOf(ch){ const m={}; for(const k in ch.matrix) m[parseFloat(k)]=ch.matrix[k]; return m; }
  function compute(ch,country,actualW,volW,decl,opt){
    let bw;
    if(ch.cat==='small'){
      if(!ch.countries[country]) return null;
      const co=ch.countries[country];
      const cr=co.charge_rule||ch.charge_rule||'max';
      if(cr==='actual') bw=actualW;
      else if(cr==='vol_if_2x_actual') bw=(volW>=actualW*2)?volW:actualW;
      else if(cr==='vol') bw=volW;
      else bw=Math.max(actualW,volW);
      const br=co.brackets; if(!br||!br.length) return null;
      const b=findBracket(br,bw);
      let base=b.rate*bw+b.reg; const parts=[`运费 ${b.rate}/kg × ${bw.toFixed(2)}kg`, `挂号 ${b.reg}`];
      let ins=0; if(opt.insurance) ins=Math.max(decl*0.007,5);
      const add=co.add||{};
      if(add.war_per_kg){ base+=add.war_per_kg*bw; parts.push(`战争附加费 ${add.war_per_kg}/kg × ${bw.toFixed(2)}kg`); }
      if(add.custom_per_shipment){ base+=add.custom_per_shipment; parts.push(`海关资料处理费 ${add.custom_per_shipment}`); }
      const taxPct=co.tax||0;
      if(taxPct){ const boxDecl=decl*(opt.qty||1); const tax=boxDecl*taxPct; base+=tax; parts.push(`VAT/DUTY(申报值×${(taxPct*100).toFixed(0)}%) ${tax.toFixed(2)}`); }
      // 云途欧盟：VAT + 代缴服务费(2%) + 3欧元/Item临时固定关税
      if(co.vat!=null){
        const boxDecl=decl*(opt.qty||1);
        const vat=boxDecl*co.vat;
        const svc=boxDecl*(co.service_fee_pct||0);
        const duty=(co.duty_fixed_eur||0)*(opt.eurFx||7.8);
        base+=vat+svc+duty;
        parts.push(`欧盟VAT(${(co.vat*100).toFixed(0)}%) ${vat.toFixed(2)}`);
        if(co.service_fee_pct) parts.push(`代缴服务费(${(co.service_fee_pct*100).toFixed(0)}%) ${svc.toFixed(2)}`);
        if(co.duty_fixed_eur) parts.push(`临时关税 ${co.duty_fixed_eur}EUR×${opt.eurFx||7.8} ${duty.toFixed(2)}`);
      }
      if(ins) parts.push(`保价 ${ins.toFixed(2)}`);
      // ★ 完整预算：加补充附加费
      const acCons=typeof document!=='undefined' && document.getElementById('acConservative')?.checked;
      if(acCons && ch.surcharges){
        const s=ch.surcharges;
        if(s.remote_per_shipment){ base+=s.remote_per_shipment; parts.push(`偏远附加 ${s.remote_per_shipment}/票`); }
        if(s.commercial_clearance_cad){ const v=s.commercial_clearance_cad*(opt.eurFx||7.8); base+=v; parts.push(`商业清关费(上限) ${v.toFixed(2)}`); }
      }
      const detail=parts.join(' + ')+(ins?` + 保价 ${ins.toFixed(2)}`:'');
      return {cost:base+ins,bw,detail};
    }
    if(ch.cat==='b2b-air'){
      bw=Math.max(actualW,volW);
      if(!(ch.dest||[]).includes(country)) return null;
      const cobj=ch.countries[country]; if(!cobj||!cobj.tiers||!cobj.tiers.length) return null;
      return {b2b:true,bw};  // 计费/附加费在 calc() 用总重统一计算
    }
    if(ch.cat==='express'){
      bw=Math.max(actualW,volW);
      const zi=countryToZone(ch,country); if(zi===null) return null;
      const m=matOf(ch); const rows=Object.keys(m).map(Number).sort((a,b)=>a-b);
      let wr=rows.filter(r=>r<=bw); wr=wr.length?Math.max.apply(null,wr):rows[0];
      let price=m[wr][zi];
      if(!ch.fuel_included) price*=(1+ch.fuel);
      const zlabel=ch.zones[zi].label;
      const detail=`分区 ${zlabel} · 重量 ${wr}kg · 总价 ${price.toFixed(2)}`+(ch.fuel_included?'（含油）':'（×燃油'+(ch.fuel*100).toFixed(0)+'%）');
      return {cost:price,bw,detail};
    }
    return null;
  }
  function calc(){
    const w=parseFloat($("#acW").value)||0,l=parseFloat($("#acL").value)||0,wd=parseFloat($("#acWd").value)||0,h=parseFloat($("#acH").value)||0;
    const country=$("#acDest").value;
    const qty=Math.max(1,parseInt($("#acQty").value)||1);
    const boxes=Math.max(1,parseInt($("#acBoxes").value)||1);
    const decl=parseFloat($("#acDecl").value)||0;
    const eurFx=parseFloat($("#acEurFx").value)||7.8;
    const opt={insurance:$("#acIns").checked, qty, eurFx};
    const cargoCat=$("#acCargo")?$("#acCargo").value:'箱包皮革';
    const nonFba=$("#acNonfba")?$("#acNonfba").checked:false;
    const wantDecl=$("#acDecl2")?$("#acDecl2").checked:false;
    const bl=parseFloat($("#acBl").value)||l, bw_=parseFloat($("#acBw").value)||wd, bh=parseFloat($("#acBh").value)||h;
    const results=[];
    const selN=document.querySelectorAll('.acChk:checked').length, totN=document.querySelectorAll('.acChk').length;
    const cntEl=document.getElementById('acCount'); if(cntEl) cntEl.textContent='已选 '+selN+' / '+totN+' 个渠道（取消勾选即不参与比价）';
    RATES.channels.forEach(ch=>{
      const fbox=document.querySelector('.acChk[data-id="'+ch.id+'"]');
      if(fbox && !fbox.checked) return;
      const co=findCountryWithAlias(ch.countries||{}, country);
      const div=co.volumetric_divisor||ch.volumetric_divisor||10000;   // ★ per-country 除数优先，回退渠道级
      const actualPerBox=w*qty;
      const volPerBox=(bl*bw_*bh)/div;
      const cr=co.charge_rule||ch.charge_rule||'max';  // 计费重规则（国家级覆盖优先）
      let bwBox;
      if(cr==='actual') bwBox=actualPerBox;
      else if(cr==='vol_if_2x_actual') bwBox=(volPerBox>=actualPerBox*2)?volPerBox:actualPerBox;
      else if(cr==='vol') bwBox=volPerBox;
      else bwBox=Math.max(actualPerBox,volPerBox);
      const r=compute(ch,country,actualPerBox,volPerBox,decl,opt);
      if(!r){ results.push({ch,status:'na'}); return; }
      if(r.below){ results.push({ch,status:'below',min:r.min}); return; }
      let total,perUnitNote;
      if(ch.cat==='small'||ch.cat==='express'){ total=r.cost*boxes; perUnitNote=`每箱 ${r.cost.toFixed(2)} × ${boxes}箱`; }
      else {
        const s=ch.sur||null;
        if(s&&s.minpc) bwBox=Math.max(bwBox,s.minpc);          // 单件最低计费重
        const totalBw=bwBox*boxes; const t=findTier(ch.countries[country].tiers,totalBw);
        if(!t){ results.push({ch,status:'below',min:ch.countries[country].tiers[0].min}); return; }
        let base=t.rate*totalBw; let surTxt='';
        if(s){
          const catRate=(s.cat&&s.cat[cargoCat])||0;
          if(catRate){ base+=catRate*totalBw; surTxt+=` + 品类附加 ${catRate}/kg×${totalBw.toFixed(1)}=${(catRate*totalBw).toFixed(2)}`; }
          if(nonFba&&s.nonfba){ const nf=Math.max((s.nonfba.kg||0)*totalBw,s.nonfba.min||0); if(nf){ base+=nf; surTxt+=` + 非FBA ${nf.toFixed(2)}`; } }
          if(wantDecl&&s.declare){ base+=s.declare; surTxt+=` + 单独报关 ${s.declare}/票`; }
        }
        total=base; perUnitNote=`总重 ${totalBw.toFixed(2)}kg × ${t.rate}/kg`+surTxt;
      }
      results.push({ch,status:'ok',cost:total,bw:bwBox,detail:r.detail||('计费重 '+bwBox.toFixed(2)+'kg'),perUnitNote});
    });
    const refW=Math.max(w*qty,(bl*bw_*bh)/10000);
    render(results,country,w,qty,boxes,refW);
  }
  function section(title,dotColor,rows){
    if(!rows.length) return '';
    rows.sort((a,b)=>a.cost-b.cost);
    const min=rows[0].cost;
    let hh=`<div style="font-weight:700;color:var(--fg);margin:18px 0 6px;font-size:14px;display:flex;gap:8px;align-items:center"><span style="width:9px;height:9px;border-radius:50%;background:${dotColor}"></span>${title}</div>`;
    hh+=`<div class="card" style="margin-top:8px"><table><thead><tr><th>渠道</th><th>承运商</th><th>除数</th><th>计费重/箱</th><th>运费构成</th><th>总价(CNY)</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const best=Math.abs(r.cost-min)<1e-6?'best':'';
      const div=r.ch.volumetric_divisor||10000;
      hh+=`<tr class="${best}"><td><b>${r.ch.name}</b><div class="mut" style="font-size:11px">${r.ch.note||''}</div></td><td class="mut">${r.ch.carrier}</td><td class="mut">${div}</td><td>${r.bw.toFixed(2)} kg</td><td>${r.detail}<br><span class="mut" style="font-size:11px">${r.perUnitNote}</span></td><td style="font-weight:700;font-size:15px">¥${r.cost.toFixed(2)}</td></tr>`;
    });
    hh+=`</tbody></table></div>`;
    return hh;
  }
  function render(results,country,w,qty,boxes,refW){
    const groups={
      small:results.filter(r=>r.ch.cat==='small'&&r.status==='ok'),
      b2b:results.filter(r=>r.ch.cat==='b2b-air'&&r.status==='ok'),
      exp:results.filter(r=>r.ch.cat==='express'&&r.status==='ok')
    };
    let html='';
    const totalPkgs=(w*qty*boxes).toFixed(2);
    html+=`<div class="card"><div class="mut">目的国 <b style="color:var(--fg)">${country}</b> ｜ 单件 ${w}kg × 每箱 ${qty} 个 × ${boxes} 箱 ｜ 参考总重约 <b style="color:var(--fg)">${totalPkgs} kg</b></div></div>`;
    html+=section('小包渠道（B2C 直发，按件/按票计费）','#3b82f6',groups.small);
    html+=section('B2B 渠道（海外仓/批量，按 kg 计费，起收 12–21kg）','#22c55e',groups.b2b);
    html+=section('商业快递（DHL / FedEx / UPS，分区总票价）','#a855f7',groups.exp);
    const na=results.filter(r=>r.status==='na');
    const below=results.filter(r=>r.status==='below');
    if(below.length) html+=`<div class="mut" style="margin-top:8px">⚠️ 低于起收重量（未计入）：${below.map(b=>`${b.ch.name}（${b.min}kg起）`).join('、')}</div>`;
    if(na.length) html+=`<div class="mut" style="margin-top:4px">该目的国无报价（不在渠道服务范围）：${na.map(n=>n.ch.name).join('、')}</div>`;
    $("#acResults").innerHTML=html;
    $("#acFn").innerHTML='计算口径说明：① 计费重=MAX(实重,长×宽×高÷渠道除数)，结果表已显示各渠道除数；② 小包/快递按“每箱一票”×箱数；③ B2B 按总重×费率 + 产品附加费；④ <b>捷邮中东</b>已计入战争附加费(kg)、海关资料处理费(票)、VAT/DUTY(申报值×比例)；⑤ <b>云途欧盟</b>已计入 VAT(申报值×国别税率)+代缴服务费(2%)+3欧元/Item临时固定关税(汇率按上方输入框)；⑥ 仍未计入：磁检费、偏远费、超品名费、旺季附加费。最终以承运商账单为准。';
  }
  $("#acCalc").addEventListener('click',calc);
  function setFilter(act){
    document.querySelectorAll('.acChk').forEach(b=>{
      if(act==='all'||act==='reset') b.checked=true;
      else if(act==='none') b.checked=false;
      else b.checked=(b.dataset.cat===act);
    });
    calc();
  }
  document.querySelectorAll('.flink').forEach(a=>{ a.addEventListener('click',e=>{ e.preventDefault(); setFilter(a.dataset.act); }); });
  document.querySelectorAll('.acChk').forEach(b=>{ b.addEventListener('change',calc); });
  $("#acEurFx").addEventListener('change',calc);
  calc();
}

/* ===================== 工具 ===================== */
function uniq(a){ return [...new Set(a)]; }
function sortDestinations(arr){
  const priority = ["美国","英国","德国","法国","意大利","西班牙","荷兰","比利时","波兰","瑞典","加拿大","澳大利亚","沙特","阿联酋","巴林","卡塔尔","科威特","阿曼","以色列","墨西哥","日本","韩国"];
  const matched=[];
  priority.forEach(p=>{ if(arr.includes(p)) matched.push(p); else { const like=arr.find(x=>x.startsWith(p)); if(like) matched.push(like); } });
  const seen=new Set(matched);
  const rest=arr.filter(x=>!seen.has(x)).sort((a,b)=>a.localeCompare(b,"zh"));
  return matched.concat(rest);
}
function buildIso2Cn(){
  if(window._ISO2CN) return window._ISO2CN;
  const m={}; if(typeof CN2ISO==='object'){ Object.keys(CN2ISO).forEach(cn=>{ const iso=CN2ISO[cn]; if(iso && !m[iso]) m[iso]=cn; }); }
  window._ISO2CN=m; return m;
}
function isoToChinese(iso){ return buildIso2Cn()[iso] || iso; }
function chineseToIso(cn){ return (typeof CN2ISO==='object' && CN2ISO[cn]) || cn; }
function bindCombo(input, listEl, items, onChange){
  const wrapper = input && input.parentElement;
  function render(filter=''){
    const f=filter.trim().toLowerCase();
    const filtered = f ? items.filter(x=>x.toLowerCase().includes(f)) : items;
    listEl.innerHTML = filtered.map(x=>`<div class="combo-item" data-v="${x}">${x}</div>`).join('');
    listEl.style.display = filtered.length ? 'block' : 'none';
  }
  input.addEventListener('focus', ()=>render(input.value));
  input.addEventListener('input', ()=>render(input.value));
  input.addEventListener('change', ()=>{ if(input._comboJustSelected){ input._comboJustSelected=false; return; } if(onChange) onChange(input.value); });
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ listEl.style.display='none'; if(onChange) onChange(input.value); } });
  listEl.addEventListener('mousedown', (e)=>{ if(e.target.classList.contains('combo-item')){ input.value=e.target.dataset.v; input._comboJustSelected=true; listEl.style.display='none'; if(onChange) onChange(input.value); } });
  if(wrapper) document.addEventListener('click', (e)=>{ if(!wrapper.contains(e.target)) listEl.style.display='none'; });
}

renderNav(); render();
