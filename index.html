function syncTobFromRates(){

    const rawDest = (c.dest||[]).map(x=>x.trim());
    const isUS3 = rawDest.some(x=>['美西','美中','美东'].includes(x));
    let countries = rawDest.map(cn=>{

      }

    const declareFee = (c.sur && c.sur.declare) ? (typeof c.sur.declare==='object' ? c.sur.declare.base||0 : c.sur.declare) : 0;
    const minpc = (first.min_charge_weight) || (c.sur && c.sur.minpc) || 12;
    return {
      id: c.id,
      cat: c.cat || 'b2b-air',   // ★ 必须带 cat，computeAll 据此路由到 B2B 三区分支；sync 只处理 b2b-air，故安全
      carrier: c.carrier || '中运通达',
      channel: c.name,
      audience: '2B',
      countries: c.countries,   // 保留原始分区对象（美国三区/欧洲仓库）—— computeAll/isUS3 需要
      isoCountries: countries,  // ISO 数组——资格校验/下拉/显示用

function findCountryWithAlias(countryMap, destCn){
  if(!destCn) return {};

/* ===================== 4 支柱归一内核（吸收自 logistics-compare-normalize） ===================== */
function volumeWeight(l,w,h,divisor){ return (l*w*h)/divisor; }
// P1-1 计费重规则：max / actual / vol / vol_if_2x_actual(体积重≥实重×2才计体积重，云途加拿大新西兰)
function chargeWeight(sw, vw, rule, rounding, minW){
  let cw = rule==="actual" ? sw : rule==="vol" ? vw : rule==="vol_if_2x_actual" ? (vw >= sw*2 ? vw : sw) : Math.max(sw, vw);
  cw = Math.ceil(cw/rounding - 1e-9) * rounding;          // 向上进位到 rounding（减1e-9修浮点，避免 0.728→0.729）
  if(cw < (minW||0)) cw = minW||0;
  return Math.max(cw, 0);
}
// channel-compare 重量段取档铁律：向上取「最小 up ≥ cw 的档」
function tierRate(tiers, cw){
  // 数据用 {up, rate, reg}（小包）或 {kg, rate}（B2B）—— 都按上界取
  const sorted = tiers.slice().sort((a,b)=>(a.up||a.kg||0)-(b.up||b.kg||0));
  let t = sorted.find(x=> (x.up!=null?x.up:x.kg) >= cw - 1e-9);
  if(!t) t = sorted[sorted.length-1];
  return t;
}
// 分区矩阵渠道（如中运通达 FedEx IP）：国家 → 分区索引（依赖渠道 countryMap: 国家→分区标签）
function zoneIndexFor(ch, country){
  if(ch.countryMap && ch.countryMap[country]){
    const lbl = ch.countryMap[country];
    for(let zi=0; zi<(ch.zones||[]).length; zi++){
      // ★ countryMap 值可能是「分区代码」(label) 或「区域名」(countries)，两种都认
      if(ch.zones[zi].label===lbl || ch.zones[zi].countries===lbl) return zi;
    }
  }
  return null;
}
// 货运引擎：真 SKU ÷ divisor → 缴费重 → 全费用展开 = Landed Cost
// destCn: 中文目的国（用于 per-country divisor / 国家级附加费 / 国家级税费覆盖）；eurFx: EUR/CNY 汇率（默认取渠道 fx 或 7.8）
// 统一附加费金额解析：支持 数值(固定) / {per_kg} / {per_piece} / {per_shipment|per_ticket|per_event} / {per_item, free}，可带 min 保底
function surAmt(v, cw, units){
  if(v==null) return 0;
  if(typeof v==='number') return v;
  let base=0;
  if(v.per_piece!=null) base = v.per_piece * (units||1);
  else if(v.per_shipment!=null || v.per_ticket!=null || v.per_event!=null) base = (v.per_shipment!=null?v.per_shipment:(v.per_ticket!=null?v.per_ticket:v.per_event))||0;
  else if(v.per_kg!=null) base = v.per_kg * (cw||0);
  else if(v.per_item!=null) base = v.per_item * Math.max(0, (units||1) - (v.free||0));
  if(v.min!=null) base = Math.max(base, v.min);
  return base;
}
function getUsdFx(){ try{ const s=localStorage.getItem('jwpei_usdCny'); if(s&&parseFloat(s)>0) return parseFloat(s); }catch(e){} const el=document.getElementById('usdFx'); const v=parseFloat(el&&el.value); return (v>0)?v:7.2; }
function computeFreight(ch, sku, units, destCn, eurFx, opts){
  opts = opts || {};
  const cargoType = opts.cargoType || sku.attr || '箱包皮革';
  const conservative = opts.conservative != null ? opts.conservative : (typeof document!=='undefined' && document.getElementById('conservativeMode')?.checked);
  const destIso = opts.destIso || (typeof CN2ISO==='object' && CN2ISO[destCn]) || destCn;
  const p = ch.pricing;
  const cm = ch.countryMap || {};
  const co = findCountryWithAlias(cm, destCn);
  // ★ 申报价 decl 货币=USD，凡用它算费用（VAT/DUTY/手续费/按值费）都先 ×USD/CNY 转人民币
  const declCny = (sku.decl||0) * getUsdFx();
  const divisor = co.volumetric_divisor || p.divisor;
  const sw = sku.weight * units;
  const vw = volumeWeight(sku.l, sku.w, sku.h, divisor) * units;
  const effectiveRule = co.charge_rule || p.charge_rule;
  const effectiveMin  = co.min_charge_weight || p.min_charge_weight || 0;
  const cw = chargeWeight(sw, vw, effectiveRule, p.rounding, effectiveMin);
  // ★ 小包修复：优先用「目的国自己的」brackets 费率与挂号费（此前 bug：全局只取渠道第一个国家的费率/挂号费，导致发法国却按美国 92/kg 计）
  const coBrackets = (co && co.brackets && co.brackets.length) ? co.brackets : null;
  // 分区矩阵渠道（zy_fedex/zy_ups）：countryMap → zone → matrix[weight]（总票价，非/kg）
  let rate, freight, matrixBase = null, matrixWk = null, matrixZi = null;
  if(ch.matrix && ch.countryMap && ch.countryMap[destCn]){
    const zi = zoneIndexFor(ch, destCn);
    if(zi !== null){
      // ★ matrix 键是字符串(如 '6.0')，必须转成 Number 键查表，否则 ch.matrix[6] 取到 undefined
      const m = {}; Object.keys(ch.matrix).forEach(k=>{ m[parseFloat(k)] = ch.matrix[k]; });
      const keys = Object.keys(m).map(Number).sort((a,b)=>a-b);
      const wk = keys.find(k => k >= cw - 1e-9) || keys[keys.length-1];
      matrixBase = (m[wk]||[])[zi];
      matrixWk = wk; matrixZi = zi;
    }
  }
  if(matrixBase != null){
    freight = matrixBase;
    rate = freight / Math.max(cw, 1e-9);
  } else {
    rate = coBrackets ? (tierRate(coBrackets, cw).rate||0) : tierRate(p.weight_tiers, cw).rate;
    freight = rate * cw;
  }
  const cwStr = fmtKg(cw, ch.cat);
  const zlabel = matrixZi != null ? ((ch.zones||[])[matrixZi]||{}).label : '';
  let items = matrixBase != null
    ? [{name:`基本运费(分区${zlabel} · ${matrixWk}kg总价)`, amt:freight}]
    : [{name:"基本运费("+rate+"/kg×"+cwStr+"kg)", amt:freight}];
  let total = freight;
  if(coBrackets){
    // 挂号费按目的国自己的 reg
    const regFee = (coBrackets[0] && coBrackets[0].reg) ? coBrackets[0].reg : 0;
    if(regFee){ items.push({name:"挂号费", amt:regFee}); total+=regFee; }
  } else {
    for(const f of (ch.fees||[])){
      let a = f.type==="fixed" ? f.value
            : f.type==="per_kg" ? f.value*cw
            : f.type==="pct_of_freight" ? freight*f.value
            : f.type==="pct_of_value" ? declCny*units*f.value : 0;
      if(a){ items.push({name:f.name, amt:a}); total+=a; }
    }
  }
  if(p.fuel_pct){ const a=freight*p.fuel_pct; items.push({name:"燃油("+(p.fuel_pct*100)+"%)",amt:a}); total+=a; }
  // 国家级附加费（战争附加费 / 海关资料处理费 等，随渠道附在 country.add）
  const add = co.add || {};
  if(add.war_per_kg){ const a=add.war_per_kg*cw; items.push({name:"战争附加费("+add.war_per_kg+"/kg×"+cwStr+"kg)",amt:a}); total+=a; }
  if(add.custom_per_shipment){ const a=add.custom_per_shipment; items.push({name:"海关资料处理费",amt:a}); total+=a; }
  // 国家级税费 VAT/DUTY（申报值×比例，如中东捷邮按目的国税率）
  const taxPct = co.tax || 0;
  if(taxPct){ const a=declCny*units*taxPct; items.push({name:"VAT/DUTY(申报值×"+(taxPct*100).toFixed(0)+"%)",amt:a}); total+=a; }
  // 欧盟：VAT + 代缴服务费(2%) + 3欧元/Item临时固定关税（云途欧盟路向）
  if(co.vat!=null){
    const fx = eurFx || p.fx || 7.8;
    const declVal=declCny*units;
    const vat=declVal*co.vat;
    const svc=declVal*(co.service_fee_pct||0);
    const duty=(co.duty_fixed_eur||0)*fx;
    items.push({name:`欧盟VAT(${(co.vat*100).toFixed(0)}%)`,amt:vat}); total+=vat;
    if(co.service_fee_pct){ items.push({name:`代缴服务费(${(co.service_fee_pct*100).toFixed(0)}%)`,amt:svc}); total+=svc; }
    if(co.duty_fixed_eur){ items.push({name:`临时关税(${co.duty_fixed_eur}EUR×${fx})`,amt:duty}); total+=duty; }
  }
  // 整渠道级 DDP/DDU 口径：DDP 含税跳过补税；DDU 按整渠道 duty_rate/vat_rate 补（绝大多数渠道这两项=0，税费已由国家字段承担）
  if(!p.tax_included && p.incoterm!=="DDP"){
    const duty = declCny*units*(p.duty_rate||0);
    const vat  = (declCny*units + freight + duty)*(p.vat_rate||0);
    if(duty){ items.push({name:"关税("+(p.duty_rate*100)+"%)",amt:duty}); total+=duty; }
    if(vat){ items.push({name:"VAT("+(p.vat_rate*100)+"%)",amt:vat}); total+=vat; }
  }
  // ★ 商业快递结构化附加费（来自中运通达/亚丰对账单真实收费口径）
  const sur = ch.sur;
  if(sur){
    // 清关费/报关费/关税预付（DDU/非包税才收；DDP 已含）
    if(sur.clearance && !p.tax_included){
      const cl = typeof sur.clearance==='object' ? (sur.clearance.per_shipment||0) : sur.clearance;
      if(cl){ items.push({name:`清关费/报关费(${cl}/票)`, amt:cl}); total+=cl; }
    }
    // 产品附加费（按货物类型 /kg）
    if(sur.product){
      const pr = (sur.product[cargoType]!=null?sur.product[cargoType]:(sur.product['普货']||0));
      if(pr){ const a=pr*cw; items.push({name:`产品附加费(${cargoType} ${pr}/kg × ${cwStr}kg)`, amt:a}); total+=a; }
    }
    // 磁检费（带电/带磁货物）
    if(sur.magnet && (sku.battery || /磁|电池/.test(cargoType||''))){
      const mg = typeof sur.magnet==='object' ? (sur.magnet.per_shipment||sur.magnet.per_ticket||0) : sur.magnet;
      if(mg){ items.push({name:`磁检费(${mg}/票)`, amt:mg}); total+=mg; }
    }
    // 高风险国家附加费（按目的国 /kg）
    if(sur.high_risk && destIso && sur.high_risk[destIso]){
      const hr = sur.high_risk[destIso]*cw;
      items.push({name:`高风险国家附加费(${destIso} ${sur.high_risk[destIso]}/kg × ${cwStr}kg)`, amt:hr}); total+=hr;
    }
    // 旺季/偏远/超长超重/改址/退件：完整预算（可能费用）模式才计入
    if(conservative){
      if(sur.peak){ const pk = typeof sur.peak==='object' ? (sur.peak.per_kg?sur.peak.per_kg*cw:(sur.peak.per_shipment||0)) : sur.peak; if(pk){ items.push({name:`旺季附加费`, amt:pk}); total+=pk; } }
      if(sur.remote){ const rm = surAmt(sur.remote, cw, units); if(rm){ items.push({name:`偏远附加费`, amt:rm}); total+=rm; } }
      if(sur.oversize){ const ov = surAmt(sur.oversize, cw, units); if(ov){ items.push({name:`超长超重附加费`, amt:ov}); total+=ov; } }
      if(sur.addr_change){ const ac = surAmt(sur.addr_change, cw, units); if(ac){ items.push({name:`更改地址费`, amt:ac}); total+=ac; } }
      if(sur.return){ const rt = surAmt(sur.return, cw, units); if(rt){ items.push({name:`退件费`, amt:rt}); total+=rt; } }
    }
  }
  total *= (p.fx||1);
  // ★ 完整预算：加偏远/磁检/商业清关等可能费用（RATES 渠道 surcharges，保守模式）
  if(conservative && ch.surcharges){
    const s=ch.surcharges;
    if(s.remote_per_shipment){ items.push({name:"偏远附加费(RMB/票)",amt:s.remote_per_shipment}); total+=s.remote_per_shipment; }
    if(s.magnetic_per_shipment && sku.battery){ items.push({name:"磁检费(RMB/票)",amt:s.magnetic_per_shipment}); total+=s.magnetic_per_shipment; }
    if(s.commercial_clearance_cad){ const v=s.commercial_clearance_cad*(p.fx||1); items.push({name:"商业清关费(上限)",amt:v}); total+=v; }
    if(s.remote_per_kg){ const v=Math.max(s.remote_per_kg*cw,s.remote_min||0); items.push({name:"偏远附加(估算/kg)",amt:v}); total+=v; }
    if(s.oversize_per_event){ items.push({name:"超尺寸附加费",amt:s.oversize_per_event}); total+=s.oversize_per_event; }
    if(s.heavy_per_event){ items.push({name:"超重附加费",amt:s.heavy_per_event}); total+=s.heavy_per_event; }
  }
  return {cw, items, total, transit:ch.decision?.transit};
}
// 资格校验（P2 硬约束）：派送对象匹配? 重量≤上限? 属性接受? audience 支持多值如["2B","2C"]
function qualify(ch, sku, units, audience, b2bType, destIso){
  const reasons=[];
  if(ch.audience && audience){
    const audList = Array.isArray(ch.audience) ? ch.audience : [ch.audience];
    if(!audList.includes(audience) && !audList.includes('2'+audience.slice(-1))) reasons.push("派送对象不符("+ch.audience+"≠"+audience+")");
  }
  if(ch.max_weight && (sku.weight*units) > ch.max_weight) reasons.push("超重("+(sku.weight*units)+"kg>"+ch.max_weight+"kg上限)");
  // 尺寸限制：白名单式 —— 仅当该渠道对该国在 rates.json 显式配置 size_rules 才校验；未配置视为"可能能发"，绝不注入默认值
  const sr = (ch.sizeRules && destIso) ? (ch.sizeRules[destIso] || ch.sizeRules.default || null) : null;
  if(sr){
    const L=sku.l||0, W=sku.w||0, H=sku.h||0;
    const arr=[L,W,H].sort((a,b)=>b-a);                 // 长≥宽≥高
    const side=arr[0], sum=arr[0]+arr[1]+arr[2], vol=arr[0]*arr[1]*arr[2], girth=arr[0]+2*(arr[1]+arr[2]);
    if(sr.max_side && side>sr.max_side) reasons.push("超单边("+side.toFixed(0)+"cm>"+sr.max_side+"cm)");
    if(sr.max_volume && vol>sr.max_volume) reasons.push("超体积("+vol.toFixed(0)+"cm³>"+sr.max_volume+"cm³)");
    if(sr.max_sum && sum>sr.max_sum) reasons.push("超三边和("+sum.toFixed(0)+"cm>"+sr.max_sum+"cm)");
    if(sr.max_girth && girth>sr.max_girth) reasons.push("超围长("+girth.toFixed(0)+"cm>"+sr.max_girth+"cm)");
  } else if(ch.max_side||ch.max_volume||ch.max_girth){  // 兼容旧 DEF 硬编码字段（当前均为空，不误淘汰）
    const side=Math.max(sku.l||0,sku.w||0,sku.h||0), vol=(sku.l||0)*(sku.w||0)*(sku.h||0), g=2*((sku.l||0)+(sku.w||0))+(sku.h||0);
    if(ch.max_side && side>ch.max_side) reasons.push("超单边("+side.toFixed(0)+"cm>"+ch.max_side+"cm)");
    if(ch.max_volume && vol>ch.max_volume) reasons.push("超体积("+vol.toFixed(0)+"cm³>"+ch.max_volume+"cm³)");
    if(ch.max_girth && g>ch.max_girth) reasons.push("超周长("+g.toFixed(0)+"cm>"+ch.max_girth+"cm)");
  }
  if(ch.accepted && !ch.accepted.includes(sku.attr)) reasons.push("属性不符("+sku.attr+"不被接受)");
  // 2B 类型细分：FBA/非FBA/商业地址
  if(audience==='2B' && b2bType && ch.b2bType && !ch.b2bType.includes(b2bType)) reasons.push("派送类型不符(渠道仅支持"+ch.b2bType.join('/')+")");
  return reasons;
}

function round1(n){ return Math.round(n*10)/10; }
/* 把订单的多个 SKU 行合成一个复合 SKU（总重/容积/申报值），外箱尺寸选填，留空按 Σ体积×1.3 估算 */
function buildComposite(ol, itemsArr, destCn){
  const resolved = ol.map(l=>({l, it: itemsArr.find(x=>x.sku===l.sku)})).filter(o=>o.it);
  if(!resolved.length) return null;
  let weight=0, vol=0, decl=0; const attrSet=new Set();
  resolved.forEach(o=>{ const q=Math.max(1,+o.l.qty||1); weight+=(+o.it.weight||0)*q; vol+=(o.it.l*o.it.w*o.it.h||0)*q; decl+=(+o.it.decl||0)*q; if(o.it.attr) attrSet.add(o.it.attr); });
  const L=+$("#orderL").value, W=+$("#orderW").value, H=+$("#orderH").value;
  let l,w,h,est;
  if(L>0&&W>0&&H>0){ l=L;w=W;h=H; est=false; } else { const s=Math.cbrt(Math.max(1,vol*1.3)); l=round1(s*1.25); w=round1(s); h=round1(s*0.8); est=true; }
  const attr = attrSet.has('带电')?'带电':'普货';
  const name = resolved.map(o=>`${o.l.sku}×${o.l.qty}`).join(' + ');
  return {sku:'__ORDER__', name, weight, l, w, h, attr, decl, _estimated:est};
}

    // 模块化默认：按当前模块渠道真实的 audience 推导（兼容 audience 为字符串或数组）
    const audSet = uniq([].concat(...M.carriers.map(c=>Array.isArray(c.audience)?c.audience:(c.audience?[c.audience]:[]))).filter(Boolean));
    const defaultAud = audSet.length===1 ? audSet[0] : (audSet.includes('2C') ? '2C' : '2B');
    const defaultUnits = 1;
    if(!ORDER_LINES.length){ ORDER_LINES=[{sku:(items[0]||{}).sku||'', qty:defaultUnits}]; saveOrder(); }
    // 目的国：内部用 ISO，界面显示中文；对 parcel（已从 RATES 同步为 ISO）做反向映射，其余模块保持原语言
    // ★ 下拉跨「小包/快递/头程」全量并集，确保「所有渠道能发的国家」都列得上（不再因某模块无该渠道而漏掉）
    const allFreightCarriers = [].concat(
      (S.modules.small && S.modules.small.carriers)||[],
      (S.modules.express && S.modules.express.carriers)||[],
      (S.modules.tob && S.modules.tob.carriers)||[]
    );
    // ★ 兼容两种 carriers 结构：旧版/小包 countries=ISO 数组；toB 同步后 countries=三区对象，ISO 数组在 isoCountries
    const carrierIsoList = (c)=>(Array.isArray(c.isoCountries)?c.isoCountries:(Array.isArray(c.countries)?c.countries:[]));
    const isoCountries = uniq(allFreightCarriers.flatMap(carrierIsoList)).filter(Boolean);
  const displayCountries = sortDestinations(isoCountries.map(isoToChinese));
  const isoOfDisplay = {};
  displayCountries.forEach(cn=>{ isoOfDisplay[cn] = (typeof CN2ISO==='object' && CN2ISO[cn]) || cn; });
  const defaultDest = displayCountries.find(x=>["美国","英国","德国"].includes(x)) || displayCountries[0] || "";
  /* 全不可发 → 拆包最优建议（FFD 贪心分箱，跨模块找最便宜可发渠道） */
  function renderSplitSuggestion(orderLines, destCn, aud, b2bType, opts){
    const destIso = opts.destIso;

    orderLines.forEach(l=>{

    const estDims=vol=>{ const v=Math.max(1,vol*1.3); const s=Math.cbrt(v); return {l:round1(s*1.25),w:round1(s),h:round1(s*0.8)}; };

    const fullComp=compFrom(unitsList); const fullBest=bestFor(fullComp);

    const usRegions=['美西','美中','美东'];
    // ★ 兼容 syncTobFromRates 后的结构：三区对象可能在 ch.regions（原 countries）或 ch.countries；ISO 数组在 ch.isoCountries
    const getUS3Map=(ch)=>{

      if(ch.countries && typeof ch.countries==='object' && !Array.isArray(ch.countries) && usRegions.some(r=>ch.countries[r]&&ch.countries[r].tiers)) return ch.countries;

      out+=`<tr class="${idx===0?"best":""}">

    $("#fOut").innerHTML=out;

  function drawCompare(){
    const sc=buildSc(), hd=buildHead(), fx=fxVal();
    const headR=getHead(hd);
    const ids=getCmpIds();
    const R={}; ids.forEach(id=> R[id]=E.calcOne(id,sc));
    const mini=t=>'<span class="rmini">'+(t.g?('🟢'+t.g):'')+(t.y?(' 🟡'+t.y):'')+(t.r0?(' 🔴'+t.r0):'')+(t.n?(' ⚪'+t.n):'')+'</span>';
    function tally(k){ let g=0,y=0,r0=0,n=0; ids.forEach(id=>{ const c=R[id].cats[k]; if(!c||!c.amt){n++;return;} const rt=c.rating; if(rt==='green')g++;else if(rt==='yellow')y++;else if(rt==='red')r0++;else n++; }); return {g,y,r0,n}; }
    let rows='';
    FEE_ORDER.forEach(k=>{
      let minV=Infinity,maxV=-Infinity,have=false;
      ids.forEach(id=>{ const c=R[id].cats[k]; if(c&&c.amt&&c.rating!=='red'&&c.rating!=='na'){ if(c.amt<minV)minV=c.amt; if(c.amt>maxV)maxV=c.amt; have=true; } });
      let tds=ids.map(id=>{ const c=R[id].cats[k]; if(!c||!c.amt) return '<td class="na">—</td>'; if(c.rating==='red'||c.rating==='na') return '<td class="na" title="'+(E.esc(c.note||'未对齐/无数据'))+'">N/A</td>'; let cls=''; if(have){ if(Math.abs(c.amt-minV)<1e-9)cls=' min'; else if(Math.abs(c.amt-maxV)<1e-9)cls=' max'; } return '<td class="'+cls+'">$'+E.fmt(c.amt)+'</td>'; }).join('');
      rows+='<tr><td>'+window.catLabel[k]+' '+mini(tally(k))+'</td>'+tds+'</tr>';
    });
    const subs=ids.map(id=>{ let s=0; for(const k in R[id].cats) s+=R[id].cats[k].amt; return s; });
    let minS=Infinity,maxS=-Infinity; ids.forEach((id,i)=>{ if(subs[i]<minS)minS=subs[i]; if(subs[i]>maxS)maxS=subs[i]; });
    let subTds=ids.map((id,i)=>{ let cls=''; if(ids.length>1){ if(Math.abs(subs[i]-minS)<1e-9)cls=' min'; else if(Math.abs(subs[i]-maxS)<1e-9)cls=' max'; } return '<td class="'+cls+'">$'+E.fmt(subs[i])+'</td>'; }).join('');
    rows+='<tr class="best"><td>操作小计($)</td>'+subTds+'</tr>';
    let headTds=ids.map(()=> headOn()?('¥'+E.fmt(headR.amt)):'<span class="na">跳过</span>').join('');
    rows+='<tr><td>头程（中国→仓，¥）'+(headOn?(' '+E.badge(headR.rating)):'')+'</td>'+headTds+'</tr>';
    const tots=subs.map(s=> headR.amt + s*fx);
    let minT=Infinity,maxT=-Infinity; ids.forEach((id,i)=>{ if(tots[i]<minT)minT=tots[i]; if(tots[i]>maxT)maxT=tots[i]; });
    let totTds=ids.map((id,i)=>{ let cls=''; if(ids.length>1){ if(Math.abs(tots[i]-minT)<1e-9)cls=' min'; else if(Math.abs(tots[i]-maxT)<1e-9)cls=' max'; } return '<td class="'+cls+'">¥'+E.fmt(tots[i])+'</td>'; }).join('');
    rows+='<tr class="best"><td>含头程总预算(¥)</td>'+totTds+'</tr>';
    let bestIdx=0; ids.forEach((id,i)=>{ if(tots[i]<tots[bestIdx]) bestIdx=i; });
    const minId=ids[bestIdx], minR=R[minId];
    const hasRed=Object.keys(minR.cats).some(k=>minR.cats[k].rating==='red');
    const zeroCore=['IB_F','STO','BFF','TAIL'].filter(k=>!(minR.cats[k]&&minR.cats[k].amt));
    let verdict='综合最低（'+(headOn()?'含头程':'仅海外仓')+'）：'+E.esc(WH[minId].name)+' ¥'+E.fmt(tots[bestIdx]);
    if(zeroCore.length) verdict+='　·　⚠️最低仓「'+zeroCore.map(k=>window.catLabel[k]).join('/')+'」为 0（免租/包干），结果仅供参考';
    if(hasRed) verdict+='　·　⚠️最低仓含🔴未对齐科目';
    const head='<div class="cmp-scroll"><table class="result-table cmp-table"><thead><tr><th>费用科目 \\ 海外仓</th>'+ids.map(id=>'<th>'+E.esc(WH[id].name)+(WH[id].bill_month?('<span class="th-month">'+E.esc(WH[id].bill_month)+'</span>'):'')+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<div class="ok" style="margin:6px 0;font-weight:600">'+verdict+'</div>'
      +'<div class="mut">每一行列出该费用科目下各仓金额；某仓<b>未提供</b>该项显示「—」、<b>未对齐/无数据</b>显示「N/A」，二者均不参与该科目最低/最高判定。表头右侧小图标 = 该科目在各仓的可验证性分布（🟢已验证/🟡部分对齐/🔴未对齐/⚪无数据）。绿=最低，红=最高（仅对可比科目）。</div>';
    $("#ovCmpRes").innerHTML='<h3>横向对比（同场景 '+ids.length+' 仓）</h3>'+head;
    const vEl=document.getElementById('ovVerdict'); if(vEl) vEl.textContent=verdict;
  }

function rMom(){
  // 主站顶部 nav 已是 4 业务域切入口；这里只嵌入看板（默认 cat=all）+ 原两期环比折叠区
  let h=`<div class="card"><h2>⑦ 环比分析　<span class="pill">按 4 业务域 · 多版历史报价单</span></h2>

    <iframe id="mIframe" src="price_change.html?cat=all&embed=1&v=1785159246" style="width:100%;border:0;background:transparent;display:block;border-radius:12px;margin-top:6px;min-height:1200px" onload="try{this.style.height=(this.contentDocument.body.scrollHeight+40)+'px'}catch(e){this.style.height='1500px'}"></iframe>
    <details style="margin-top:14px"><summary style="cursor:pointer;color:var(--acc);font-size:13px">▸ 主站内置两期环比（基于 RATES.history，选模块+目的国）</summary>
      <div style="margin-top:10px">
        <label>模块</label><select id="mMod">${Object.keys(S.modules).filter(k=>S.modules[k].engine==="freight").map(k=>`<option value="${k}">${S.modules[k].name}</option>`).join("")}</select>
        目的国 <select id="mDest"></select>
        <button class="act" id="mRun" style="margin-left:8px">看环比</button>
        <div id="mOut"></div>
      </div>
    </details>
  </div>`;
  $("#app").innerHTML=h;
  const fillDest=()=>{ const M=S.modules[$("#mMod").value]; $("#mDest").innerHTML=uniq(M.carriers.flatMap(c=>Array.isArray(c.isoCountries)?c.isoCountries:(Array.isArray(c.countries)?c.countries:[]))).map(c=>`<option>${c}</option>`).join(""); };
  $("#mMod").onchange=fillDest; fillDest();
  $("#mRun").onclick=()=>{
    const M=S.modules[$("#mMod").value], dest=$("#mDest").value;
    const isoList=(c)=>Array.isArray(c.isoCountries)?c.isoCountries:(Array.isArray(c.countries)?c.countries:[]);
    const carriers=M.carriers.filter(c=>isoList(c).includes(dest) && c.history && c.history.length>=2);
    if(!carriers.length){ $("#mOut").innerHTML=`<div class="mut">该模块「${dest}」暂无可环比渠道（需 ≥2 期 history）。</div>`; return; }
    let out=`<h3>${M.name} · ${dest} · 环比（最新 vs 次新）</h3>`;
    carriers.forEach(ch=>{
      const h=ch.history.slice().sort((a,b)=>a.date<b.date?1:-1); // 新→旧
      const cur=h[0], prev=h[1];
      out+=`<div style="margin:10px 0"><b>${ch.carrier}·${ch.channel}</b> <span class="mut">(${prev.date} → ${cur.date})</span></div><table><thead><tr><th>重量段上限kg</th><th>上期¥/kg</th><th>本期¥/kg</th><th>Δ元</th><th>方向</th></tr></thead><tbody>`;
      const merged=uniq([...cur.tiers,...prev.tiers].map(t=>t.kg)).sort((a,b)=>a-b);
      merged.forEach(kg=>{
        const a=(prev.tiers.find(t=>t.kg===kg)||{}).rate, b=(cur.tiers.find(t=>t.kg===kg)||{}).rate;
        if(a==null||b==null){ out+=`<tr><td>${kg}</td><td>${a??"—"}</td><td>${b??"—"}</td><td colspan=2 class="mut">仅一期有</td></tr>`; return; }
        const d=b-a, cls=d>0?"up":(d<0?"down":"mut");
        out+=`<tr><td>${kg}</td><td>${a}</td><td>${b}</td><td class="${cls}">${d>0?"+":""}${d}</td><td class="${cls}">${d>0?"▲ 涨":"▼ 跌"}</td></tr>`;
      });
      out+=`</tbody></table>`;
    });
    out+=`<div class="mut">如需多期趋势，通道已存 history 数组，后续加时间轴即可扩展（不破坏骨架）。</div>`;
    $("#mOut").innerHTML=out;
  };
}

  }

  let h = `<div class="card"><h2>⑨ 全渠道比价　<span class="pill">W102 真实费率 · ${RATES.channels.length} 渠道</span></h2>
    <div class="note">输入一个 SKU（自动带出谷仓 2317 条重量/尺寸）或手填货物 + 目的国 → 自动列出该国<b>所有在约渠道</b>价格，按<b>小包 / B2B / 商业快递</b>三块横向对比，最便宜整行标绿。<br>来源：云途 / 中运通达 / 亚丰(璞景/德翼) / 飞特 报价表（W102 邮箱，2026-07 生效）。</div>

      <div><label>宽 cm</label><input id="acWd" type="number" step="0.1" value="20"></div>

  function fillFromSku(){

      const vol=s.l*s.w*s.h;
      $("#acSkuInfo").innerHTML=`已带出：${s.sku} · ${s.name||''} · ${s.weight}kg · ${s.l}×${s.w}×${s.h}cm · 单件体积<b>${vol}cm³</b>`+(s.hs?` · HS:${s.hs}`:'');

  // ---- 引擎（与独立验证版一致） ----
  function findBracket(br,w){ for(const b of br){ if(w<=b.up) return b; } return br[br.length-1]; }
  function findTier(tiers,w){ if(!tiers||!tiers.length) return null; let last=null; for(const t of tiers){ if(w>=t.min) last=t; else break; } return last; }
  function countryToZone(ch,country){
    // 优先走显式 countryMap（zy_fedex/zy_ups 等国家→分区标签映射）
    if(ch.countryMap && ch.countryMap[country]){
      const lbl = ch.countryMap[country];
      for(let zi=0;zi<ch.zones.length;zi++){
        // ★ countryMap 值可能是「分区代码」(label) 或「区域名」(countries)，两种都认
        if(ch.zones[zi].label===lbl || ch.zones[zi].countries===lbl) return zi;
      }
    }
    for(let zi=0;zi<ch.zones.length;zi++){ const parts=ch.zones[zi].countries.split(/[、,，\s]+/).filter(x=>x.trim()); if(parts.includes(country)) return zi; }
    if(country==='美国'){ for(let zi=0;zi<ch.zones.length;zi++){ const parts=ch.zones[zi].countries.split(/[、,，\s]+/).filter(x=>x.trim()); if(parts.some(p=>p.startsWith('美'))) return zi; } }
    if(country==='加拿大'){ for(let zi=0;zi<ch.zones.length;zi++){ const c=ch.zones[zi].countries; if(c.includes('加墨')||c.includes('加拿大')) return zi; } }
    return null;
  }
  function matOf(ch){ const m={}; for(const k in ch.matrix) m[parseFloat(k)]=ch.matrix[k]; return m; }
  function compute(ch,country,actualW,volW,decl,opt){
    let bw;
    if(ch.cat==='small'){
      if(!ch.countries[country]) return null;
      const co=ch.countries[country];
      const declCny=decl*getUsdFx();  // 手动申报值按 USD 处理，先转 CNY
      const cr=co.charge_rule||ch.charge_rule||'max';
      if(cr==='actual') bw=actualW;
      else if(cr==='vol_if_2x_actual') bw=(volW>=actualW*2)?volW:actualW;
      else if(cr==='vol') bw=volW;
      else bw=Math.max(actualW,volW);
      const br=co.brackets; if(!br||!br.length) return null;
      const b=findBracket(br,bw);
      let base=b.rate*bw+b.reg; const bwStr=fmtKg(bw, ch.cat); const parts=[`运费 ${b.rate}/kg × ${bwStr}kg`, `挂号 ${b.reg}`];
      let ins=0; if(opt.insurance) ins=Math.max(declCny*0.007,5);  // 申报值(USD)×0.7% 最低5元(CNY)，已转人民币
      const add=co.add||{};
      if(add.war_per_kg){ base+=add.war_per_kg*bw; parts.push(`战争附加费 ${add.war_per_kg}/kg × ${bwStr}kg`); }
      if(add.custom_per_shipment){ base+=add.custom_per_shipment; parts.push(`海关资料处理费 ${add.custom_per_shipment}`); }
      const taxPct=co.tax||0;
      if(taxPct){ const boxDecl=declCny*(opt.qty||1); const tax=boxDecl*taxPct; base+=tax; parts.push(`VAT/DUTY(申报值×${(taxPct*100).toFixed(0)}%) ${tax.toFixed(2)}`); }
      // 云途欧盟：VAT + 代缴服务费(2%) + 3欧元/Item临时固定关税
      if(co.vat!=null){
        const boxDecl=declCny*(opt.qty||1);
        const vat=boxDecl*co.vat;
        const svc=boxDecl*(co.service_fee_pct||0);
        const duty=(co.duty_fixed_eur||0)*(opt.eurFx||7.8);
        base+=vat+svc+duty;
        parts.push(`欧盟VAT(${(co.vat*100).toFixed(0)}%) ${vat.toFixed(2)}`);
        if(co.service_fee_pct) parts.push(`代缴服务费(${(co.service_fee_pct*100).toFixed(0)}%) ${svc.toFixed(2)}`);
        if(co.duty_fixed_eur) parts.push(`临时关税 ${co.duty_fixed_eur}EUR×${opt.eurFx||7.8} ${duty.toFixed(2)}`);
      }
      if(ins) parts.push(`保价 ${ins.toFixed(2)}`);
      // ★ 完整预算：加补充附加费
      const acCons=typeof document!=='undefined' && document.getElementById('acConservative')?.checked;
      if(acCons && ch.surcharges){
        const s=ch.surcharges;
        if(s.remote_per_shipment){ base+=s.remote_per_shipment; parts.push(`偏远附加 ${s.remote_per_shipment}/票`); }
        if(s.commercial_clearance_cad){ const v=s.commercial_clearance_cad*(opt.eurFx||7.8); base+=v; parts.push(`商业清关费(上限) ${v.toFixed(2)}`); }
      }
      const detail=parts.join(' + ')+(ins?` + 保价 ${ins.toFixed(2)}`:'');
      return {cost:base+ins,bw,detail};
    }
    if(ch.cat==='b2b-air'){
      bw=Math.max(actualW,volW);
      if(!(ch.dest||[]).includes(country)) return null;
      const cobj=ch.countries[country]; if(!cobj||!cobj.tiers||!cobj.tiers.length) return null;
      return {b2b:true,bw};  // 计费/附加费在 calc() 用总重统一计算
    }
    if(ch.cat==='express'){
      bw=Math.max(actualW,volW);
      const zi=countryToZone(ch,country); if(zi===null) return null;
      const m=matOf(ch); const rows=Object.keys(m).map(Number).sort((a,b)=>a-b);
      let wr=rows.filter(r=>r<=bw); wr=wr.length?Math.max.apply(null,wr):rows[0];
      let price=m[wr][zi];
      if(!ch.fuel_included) price*=(1+ch.fuel);
      const zlabel=ch.zones[zi].label;
      const detail=`分区 ${zlabel} · 重量 ${wr}kg · 总价 ${price.toFixed(2)}`+(ch.fuel_included?'（含油）':'（×燃油'+(ch.fuel*100).toFixed(0)+'%）');
      return {cost:price,bw,detail};
    }
    return null;
  }
  function calc(){
    const w=parseFloat($("#acW").value)||0,l=parseFloat($("#acL").value)||0,wd=parseFloat($("#acWd").value)||0,h=parseFloat($("#acH").value)||0;
    const country=$("#acDest").value;
    const qty=Math.max(1,parseInt($("#acQty").value)||1);
    const boxes=Math.max(1,parseInt($("#acBoxes").value)||1);
    const decl=parseFloat($("#acDecl").value)||0;
    const eurFx=parseFloat($("#acEurFx").value)||7.8;
    const opt={insurance:$("#acIns").checked, qty, eurFx};
    const cargoCat=$("#acCargo")?$("#acCargo").value:'箱包皮革';
    const nonFba=$("#acNonfba")?$("#acNonfba").checked:false;
    const wantDecl=$("#acDecl2")?$("#acDecl2").checked:false;
    const bl=parseFloat($("#acBl").value)||l, bw_=parseFloat($("#acBw").value)||wd, bh=parseFloat($("#acBh").value)||h;
    const results=[];
    const selN=document.querySelectorAll('.acChk:checked').length, totN=document.querySelectorAll('.acChk').length;
    const cntEl=document.getElementById('acCount'); if(cntEl) cntEl.textContent='已选 '+selN+' / '+totN+' 个渠道（取消勾选即不参与比价）';
    RATES.channels.forEach(ch=>{
      const fbox=document.querySelector('.acChk[data-id="'+ch.id+'"]');
      if(fbox && !fbox.checked) return;
      const co=findCountryWithAlias(ch.countries||{}, country);
      const div=co.volumetric_divisor||ch.volumetric_divisor||10000;   // ★ per-country 除数优先，回退渠道级
      const actualPerBox=w*qty;
      const volPerBox=(bl*bw_*bh)/div;
      const cr=co.charge_rule||ch.charge_rule||'max';  // 计费重规则（国家级覆盖优先）
      let bwBox;
      if(cr==='actual') bwBox=actualPerBox;
      else if(cr==='vol_if_2x_actual') bwBox=(volPerBox>=actualPerBox*2)?volPerBox:actualPerBox;
      else if(cr==='vol') bwBox=volPerBox;
      else bwBox=Math.max(actualPerBox,volPerBox);
      const r=compute(ch,country,actualPerBox,volPerBox,decl,opt);
      if(!r){ results.push({ch,status:'na'}); return; }
      if(r.below){ results.push({ch,status:'below',min:r.min}); return; }
      let total,perUnitNote;
      if(ch.cat==='small'||ch.cat==='express'){ total=r.cost*boxes; perUnitNote=`每箱 ${r.cost.toFixed(2)} × ${boxes}箱`; }
      else {
        const s=ch.sur||null;
        if(s&&s.minpc) bwBox=Math.max(bwBox,s.minpc);          // 单件最低计费重
        const totalBw=bwBox*boxes; const t=findTier(ch.countries[country].tiers,totalBw);
        if(!t){ results.push({ch,status:'below',min:ch.countries[country].tiers[0].min}); return; }
        let base=t.rate*totalBw; let surTxt='';
        if(s){
          const catRate=(s.cat&&s.cat[cargoCat])||0;
          if(catRate){ base+=catRate*totalBw; surTxt+=` + 品类附加 ${catRate}/kg×${totalBw.toFixed(1)}=${(catRate*totalBw).toFixed(2)}`; }
          if(nonFba&&s.nonfba){ const nf=Math.max((s.nonfba.kg||0)*totalBw,s.nonfba.min||0); if(nf){ base+=nf; surTxt+=` + 非FBA ${nf.toFixed(2)}`; } }
          if(wantDecl&&s.declare){ base+=s.declare; surTxt+=` + 单独报关 ${s.declare}/票`; }
        }
        total=base; perUnitNote=`总重 ${totalBw.toFixed(2)}kg × ${t.rate}/kg`+surTxt;
      }
      results.push({ch,status:'ok',cost:total,bw:bwBox,detail:r.detail||('计费重 '+bwBox.toFixed(2)+'kg'),perUnitNote});
    });
    const refW=Math.max(w*qty,(bl*bw_*bh)/10000);
    render(results,country,w,qty,boxes,refW);
  }
  function section(title,dotColor,rows){
    if(!rows.length) return '';
    rows.sort((a,b)=>a.cost-b.cost);
    const min=rows[0].cost;
    let hh=`<div style="font-weight:700;color:var(--fg);margin:18px 0 6px;font-size:14px;display:flex;gap:8px;align-items:center"><span style="width:9px;height:9px;border-radius:50%;background:${dotColor}"></span>${title}</div>`;
    hh+=`<div class="card" style="margin-top:8px"><table><thead><tr><th>渠道</th><th>承运商</th><th>除数</th><th>计费重/箱</th><th>运费构成</th><th>总价(CNY)</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const best=Math.abs(r.cost-min)<1e-6?'best':'';
      const div=r.ch.volumetric_divisor||10000;
      hh+=`<tr class="${best}"><td><b>${r.ch.name}</b><div class="mut" style="font-size:11px">${r.ch.note||''}</div></td><td class="mut">${r.ch.carrier}</td><td class="mut">${div}</td><td>${r.bw.toFixed(2)} kg</td><td>${r.detail}<br><span class="mut" style="font-size:11px">${r.perUnitNote}</span></td><td style="font-weight:700;font-size:15px">¥${r.cost.toFixed(2)}</td></tr>`;
    });
    hh+=`</tbody></table></div>`;
    return hh;
  }
  function render(results,country,w,qty,boxes,refW){
    const groups={
      small:results.filter(r=>r.ch.cat==='small'&&r.status==='ok'),
      b2b:results.filter(r=>r.ch.cat==='b2b-air'&&r.status==='ok'),
      exp:results.filter(r=>r.ch.cat==='express'&&r.status==='ok')
    };
    let html='';
    const totalPkgs=(w*qty*boxes).toFixed(2);
    html+=`<div class="card"><div class="mut">目的国 <b style="color:var(--fg)">${country}</b> ｜ 单件 ${w}kg × 每箱 ${qty} 个 × ${boxes} 箱 ｜ 参考总重约 <b style="color:var(--fg)">${totalPkgs} kg</b></div></div>`;
    html+=section('小包渠道（B2C 直发，按件/按票计费）','#3b82f6',groups.small);
    html+=section('B2B 渠道（海外仓/批量，按 kg 计费，起收 12–21kg）','#22c55e',groups.b2b);
    html+=section('商业快递（DHL / FedEx / UPS，分区总票价）','#a855f7',groups.exp);
    const na=results.filter(r=>r.status==='na');
    const below=results.filter(r=>r.status==='below');
    if(below.length) html+=`<div class="mut" style="margin-top:8px">⚠️ 低于起收重量（未计入）：${below.map(b=>`${b.ch.name}（${b.min}kg起）`).join('、')}</div>`;
    if(na.length) html+=`<div class="mut" style="margin-top:4px">该目的国无报价（不在渠道服务范围）：${na.map(n=>n.ch.name).join('、')}</div>`;
    $("#acResults").innerHTML=html;
    $("#acFn").innerHTML='计算口径说明：① 计费重=MAX(实重,长×宽×高÷渠道除数)，结果表已显示各渠道除数；② 小包/快递按“每箱一票”×箱数；③ B2B 按总重×费率 + 产品附加费；④ <b>捷邮中东</b>已计入战争附加费(kg)、海关资料处理费(票)、VAT/DUTY(申报值×比例)；⑤ <b>云途欧盟</b>已计入 VAT(申报值×国别税率)+代缴服务费(2%)+3欧元/Item临时固定关税(汇率按上方输入框)；⑥ 仍未计入：磁检费、偏远费、超品名费、旺季附加费。最终以承运商账单为准。';
  }
  $("#acCalc").addEventListener('click',calc);
  function setFilter(act){
    document.querySelectorAll('.acChk').forEach(b=>{
      if(act==='all'||act==='reset') b.checked=true;
      else if(act==='none') b.checked=false;
      else b.checked=(b.dataset.cat===act);
    });
    calc();
  }
  document.querySelectorAll('.flink').forEach(a=>{ a.addEventListener('click',e=>{ e.preventDefault(); setFilter(a.dataset.act); }); });
  document.querySelectorAll('.acChk').forEach(b=>{ b.addEventListener('change',calc); });
  $("#acEurFx").addEventListener('change',calc);
  calc();
}

/* ===================== 工具 ===================== */
function uniq(a){ return [...new Set(a)]; }
function sortDestinations(arr){
  const priority = ["美国","英国","德国","法国","意大利","西班牙","荷兰","比利时","波兰","瑞典","加拿大","澳大利亚","沙特","阿联酋","巴林","卡塔尔","科威特","阿曼","以色列","墨西哥","日本","韩国"];
  const matched=[];
  priority.forEach(p=>{ if(arr.includes(p)) matched.push(p); else { const like=arr.find(x=>x.startsWith(p)); if(like) matched.push(like); } });
  const seen=new Set(matched);
  const rest=arr.filter(x=>!seen.has(x)).sort((a,b)=>a.localeCompare(b,"zh"));
  return matched.concat(rest);
}
function buildIso2Cn(){
  if(window._ISO2CN) return window._ISO2CN;
  const m={}; if(typeof CN2ISO==='object'){ Object.keys(CN2ISO).forEach(cn=>{ const iso=CN2ISO[cn]; if(iso && !m[iso]) m[iso]=cn; }); }
  window._ISO2CN=m; return m;
}
function isoToChinese(iso){ return buildIso2Cn()[iso] || iso; }
function chineseToIso(cn){ return (typeof CN2ISO==='object' && CN2ISO[cn]) || cn; }
function bindCombo(input, listEl, items, onChange){
  const wrapper = input && input.parentElement;
  function render(filter=''){
    const f=filter.trim().toLowerCase();
    const filtered = f ? items.filter(x=>x.toLowerCase().includes(f)) : items;
    listEl.innerHTML = filtered.map(x=>`<div class="combo-item" data-v="${x}">${x}</div>`).join('');
    listEl.style.display = filtered.length ? 'block' : 'none';
  }
  input.addEventListener('focus', ()=>render(input.value));
  input.addEventListener('input', ()=>render(input.value));
  input.addEventListener('change', ()=>{ if(input._comboJustSelected){ input._comboJustSelected=false; return; } if(onChange) onChange(input.value); });
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ listEl.style.display='none'; if(onChange) onChange(input.value); } });
  listEl.addEventListener('mousedown', (e)=>{ if(e.target.classList.contains('combo-item')){ input.value=e.target.dataset.v; input._comboJustSelected=true; listEl.style.display='none'; if(onChange) onChange(input.value); } });
  if(wrapper) document.addEventListener('click', (e)=>{ if(!wrapper.contains(e.target)) listEl.style.display='none'; });
}

function unpackPackSpecs(min){

function loadPackSpecs(cb){
  if(PACK_LOADED){ if(cb) cb(); return; }
  if(!S.packSpecs) S.packSpecs = {};
  var keys = Object.keys(S.packSpecs);
  if(keys.length > 0){
    PACK_SPECS = S.packSpecs;
    PACK_LOADED = true;
    if(cb) cb();
    return;
  }
  // 优先使用内联压缩数据（0额外请求，点开即显）
  if(typeof window.PACK_MIN !== "undefined"){
    var merged = unpackPackSpecs(window.PACK_MIN);
    S.packSpecs = merged;
    PACK_SPECS = merged;
    PACK_ERROR = false;
    PACK_LOADED = true;
    saveState();
    if(cb) cb();
    return;
  }
  // fallback: 老版本 fetch 原始 JSON
  fetch("packing_specs.json?_="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(j && j.specs){
        var merged = {};
        for(var sk in S.packSpecs) merged[sk] = S.packSpecs[sk];
        for(var sk in j.specs){
          if(!merged[sk]){

              spu: s.spu||"",

function estimatePackSpec(sku, gcItem){
  if(!gcItem) gcItem = GC[sku];
  if(!gcItem) return null;
  var l = +gcItem.l || 10;
  var w = +gcItem.w || 10;
  var h = +gcItem.h || 10;
  var wt = +gcItem.weight || 0.1;
  var vol = l*w*h;
  var boxSizes = [
    {l:40,w:30,h:30, name:"40x30x30"},
    {l:50,w:40,h:30, name:"50x40x30"},
    {l:58.5,w:33.8,h:53.3, name:"58.5x33.8x53.3"},
    {l:60,w:51,h:34.5, name:"60x51x34.5"}
  ];
  var selected = boxSizes[0];
  var bestQty = 0;
  for(var i=0; i<boxSizes.length; i++){
    var bx = boxSizes[i];
    var boxVol = bx.l*bx.w*bx.h;
    var maxQty = Math.floor(boxVol * 0.6 / vol);
    if(maxQty < 1) maxQty = 1;
    if(maxQty > bestQty && maxQty <= 200){
      bestQty = maxQty;
      selected = bx;
    }
  }
  if(bestQty < 1) bestQty = 1;
  var qpb = bestQty;
  var gw = Math.round(wt * qpb * 1.08 * 100) / 100;
  return {
    box_l: selected.l, box_w: selected.w, box_h: selected.h,
    qty_per_box: qpb, gw_per_box: gw,
    source: "est", spec: selected.name,
    spu: gcItem.name||""
  };
}

/* ===================== 11 装箱清单 ===================== */
// 输入清单（用户录入的原始行，持久化到 S.manifest）。混装是「计算层」的事，不污染源数据。
var MANIFEST = (S.manifest && S.manifest.length) ? S.manifest : [];
var MANI_MANUAL_MIXES = S.manualMixes || [];   // 手动混装箱（高级自定义）
var MANI_AUTOMIX = (S.maniAutoMix == null) ? true : !!S.maniAutoMix;  // 自动混装余数：默认开
var MANI_MIX_DIMS = S.maniMixDims || null;     // 混装箱外箱(cm)，null=自动取余数SKU最大箱型
var MANI_MIX_TARE = 0.5;   // 混装箱皮重(kg)
var MANI_VIEW = [];        // 计算后的有效清单（满箱行 + 自动混装 + 手动混装）
var MANI_DIVISOR = 6000;
var MANI_TOTAL_BOXES = 0, MANI_TOTAL_GW = 0, MANI_TOTAL_CBM = 0, MANI_TOTAL_VW = 0, MANI_TOTAL_CW = 0, MANI_MIN_BOX_TRIGGERED = 0;
var MANI_MIN_BOX_KG = 12;   // 尾程快递单箱计费重最低标准(kg)

function maniSave(){ try{ S.manifest=MANIFEST; S.manualMixes=MANI_MANUAL_MIXES; S.maniAutoMix=MANI_AUTOMIX; S.maniMixDims=MANI_MIX_DIMS; saveState(); }catch(e){} }

/* —— 混装箱核心：整箱保留 + 余数自动混装（FFD 装箱）。底层 calcManifest 零改动，只是多一种 isMixed 行 —— */
function manUnitW(r){ return r.qty>0 ? r.gw/r.qty : 0; }
function manUnitVol(r){ return r.qpb>0 ? (r.box_l*r.box_w*r.box_h)/1000000/r.qpb : 0; }
// 余数池：每个 SKU 装满整箱后剩下的件数
function manPool(){
  var pool=[];
  MANIFEST.forEach(function(r){
    if(!r.qpb||r.qpb<=0) return;
    var full=Math.floor(r.qty/r.qpb), rem=r.qty-full*r.qpb;
    if(rem>0) pool.push({sku:r.sku,name:r.name,qty:rem,unitW:manUnitW(r),unitVol:manUnitVol(r),dims:[r.box_l,r.box_w,r.box_h]});
  });
  return pool;
}
// 混装箱默认外箱 = 余数 SKU 里最大的箱型（B 预填，省事不逼填）
function manDefaultDims(pool){
  var L=0,W=0,H=0;
  pool.forEach(function(p){ L=Math.max(L,p.dims[0]||0); W=Math.max(W,p.dims[1]||0); H=Math.max(H,p.dims[2]||0); });
  return {l:L||30,w:W||20,h:H||15};
}
function manDims(pool){ return (MANI_MIX_DIMS&&MANI_MIX_DIMS.l)?MANI_MIX_DIMS:manDefaultDims(pool); }
// FFD 装箱：把余数件数按体积优先塞进混装箱，装不下自动拆多箱
function manPack(pool, dims){
  var cap=(dims.l*dims.w*dims.h)/1000000;
  var pieces=[];
  pool.forEach(function(p){ for(var i=0;i<p.qty;i++) pieces.push({sku:p.sku,vol:p.unitVol,w:p.unitW}); });
  pieces.sort(function(a,b){ return b.vol-a.vol; });
  var bins=[];
  pieces.forEach(function(pc){
    for(var b=0;b<bins.length;b++){
      if(bins[b].vol+pc.vol<=cap){ bins[b].vol+=pc.vol; bins[b].items[pc.sku]=(bins[b].items[pc.sku]||0)+1; bins[b].w+=pc.w; return; }
    }
    var nb={vol:pc.vol,items:{},w:pc.w}; nb.items[pc.sku]=1; bins.push(nb);
  });
  return bins;
}
function manRow(mix, dims, kind, idx){
  var tq=0,tw=0,vol=0;
  mix.forEach(function(m){ tq+=m.qty; tw+=m.unitW*m.qty; vol+=m.unitVol*m.qty; });
  tw+=MANI_MIX_TARE;
  var cv=(dims.l*dims.w*dims.h)/1000000;
  var occ=cv>0?(vol/cv*100):100;
  return {kind:kind,mixIdx:idx,mix:mix,box_l:dims.l,box_w:dims.w,box_h:dims.h,
    qpb:tq,qty:tq,boxes:1,gw:tw,cbm:cv,occupancy:occ,isMixed:true,source:"mixed",
    name:"混装箱",sku:mix.map(function(m){return m.sku;}).join("+")};
}
// 计算有效清单：自动混装模式=满箱行+余数混装；关闭=源行满数量展示；最后附手动混装
function buildManView(){
  var view=[];
  if(MANI_AUTOMIX){
    MANIFEST.forEach(function(r,idx){
      if(!r.qpb||r.qpb<=0) return;
      var full=Math.floor(r.qty/r.qpb);
      if(full>0){
        view.push({kind:"single",srcIdx:idx,sku:r.sku,name:r.name,spec:r.spec,
          box_l:r.box_l,box_w:r.box_w,box_h:r.box_h,qpb:r.qpb,qty:full*r.qpb,boxes:full,
          gw:(r.gw/r.qty)*full*r.qpb,cbm:r.cbm*(full*r.qpb/r.qty),source:r.source,isMixed:false});
      }
    });
    var pool=manPool();
    if(pool.length>0){
      var dims=manDims(pool);
      manPack(pool,dims).forEach(function(bin,i){
        var mix=[];
        Object.keys(bin.items).forEach(function(sku){
          var p=pool.find(function(x){return x.sku===sku;});
          mix.push({sku:sku,name:p.name,qty:bin.items[sku],unitW:p.unitW,unitVol:p.unitVol});
        });
        view.push(manRow(mix,dims,"mixed-auto",i));
      });
    }
  } else {
    MANIFEST.forEach(function(r,idx){
      if(!r.qpb||r.qpb<=0) return;
      view.push({kind:"single",srcIdx:idx,sku:r.sku,name:r.name,spec:r.spec,
        box_l:r.box_l,box_w:r.box_w,box_h:r.box_h,qpb:r.qpb,qty:r.qty,
        boxes:Math.ceil(r.qty/r.qpb),gw:r.gw,cbm:r.cbm,source:r.source,isMixed:false});
    });
  }
  MANI_MANUAL_MIXES.forEach(function(m,idx){ view.push(manRow(m.mix,{l:m.box_l,w:m.box_w,h:m.box_h},"mixed-manual",idx)); });
  return view;
}

      var vw = (row.box_l*row.box_w*row.box_h*row.boxes)/MANI_DIVISOR;
      var vwBox=(row.box_l*row.box_w*row.box_h)/MANI_DIVISOR;
      var gwBox=row.gw/(row.boxes||1);
      var cwBox=Math.max(gwBox, vwBox);
      var cwMinFlag = cwBox < MANI_MIN_BOX_KG;
      if(cwMinFlag) cwBox = MANI_MIN_BOX_KG;
      var occHtml = isMix ? ('<span class="'+(row.occupancy<=100?'ok':'err')+'">'+(row.occupancy<=100?'占容 '+Math.round(row.occupancy)+'% ✓':'⚠'+Math.round(row.occupancy)+'%')+'</span>') : '<span class="mut">—</span>';
      var chk = !isMix ? '<input type="checkbox" data-mchk="'+row.srcIdx+'" title="勾选后合并为混装箱">' : '';
      var skuCell, nameCell;
      if(isMix){
        var chips=row.mix.map(function(m){return esc(m.sku)+' <b>×'+m.qty+'</b>';}).join(' · ');
        skuCell='<span class="mix-title">混装箱 #'+(row.kind==='mixed-manual'?'M':'A')+(row.mixIdx+1)+'</span><div class="mix-chips">'+chips+'</div>';
        nameCell='混装';
      }else{ skuCell='<b>'+esc(row.sku)+'</b>'; nameCell=esc(row.name); }
      var delBtn = isMix
        ? (row.kind==='mixed-manual'?'<button class="ghost" data-mdelm="'+row.mixIdx+'" style="padding:2px 6px;font-size:11px">X</button>':'<span class="mut">—</span>')
        : '<button class="ghost" data-mdel="'+row.srcIdx+'" style="padding:2px 6px;font-size:11px">X</button>';
      h += '<tr'+(isMix?' class="row-mix"':'')+'>';
      h += '<td>'+chk+'</td>';
      h += '<td>'+skuCell+'</td><td>'+nameCell+'</td><td>'+(isMix?(row.box_l+'x'+row.box_w+'x'+row.box_h+'cm'):row.spec)+'</td>';
      h += '<td>'+row.qpb+'</td><td>'+row.qty+'</td><td>'+row.boxes+'</td>';
      h += '<td>'+fmt(row.gw)+'</td><td>'+fmt(row.cbm)+'</td><td>'+fmt(vw)+'</td>';
      h += '<td'+(cwMinFlag?' class="s-charge" title="单箱计费重<'+MANI_MIN_BOX_KG+'kg，按尾程最低 '+MANI_MIN_BOX_KG+'kg/箱计"':'')+'>'+fmt(cwBox)+(cwMinFlag?' ⚠':'')+'</td>';
      h += '<td>'+occHtml+'</td><td>'+src+'</td><td>'+delBtn+'</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="ps-summary">';
    h += '<span>SKU: <b>'+MANIFEST.length+'</b></span>';
    h += '<span>Boxes: <b>'+MANI_TOTAL_BOXES+'</b></span>';
    h += '<span>GW: <b>'+fmt(MANI_TOTAL_GW)+' kg</b></span>';
    h += '<span>CBM: <b>'+fmt(MANI_TOTAL_CBM)+'</b></span>';
    h += '<span>VW: <b>'+fmt(MANI_TOTAL_VW)+' kg</b></span>';
    h += '<span class="s-charge">Charge Wt: <b>'+fmt(chargeWt)+' kg</b></span>';
    h += '</div>';
  } else {
    h += '<div style="padding:20px;text-align:center;color:var(--mut)">Empty manifest. Paste SKU list above and click AI Match, or add manually.</div>';
  }
  h += '</div>';

  document.getElementById("app").innerHTML = h;

  document.getElementById("mcDivisor").onchange = function(){ MANI_DIVISOR=+this.value||6000; _rPackCalc(); };

  document.getElementById("mcAI").onclick = function(){
    var raw = document.getElementById("mcBulk").value.trim();
    if(!raw){ document.getElementById("mcStat").innerHTML='<span class="err">Please paste SKU list first</span>'; return; }
    var lines = raw.split("\n");
    var parsed = [];
    lines.forEach(function(line){
      line=line.trim(); if(!line) return;
      var parts=line.split(/[\t,;，；\s]+/);
      if(parts.length<2) return;
      var sku=parts[0].trim(); var qty=parseInt(parts[1].trim());
      if(!sku||!qty||qty<1) return;
      parsed.push({sku:sku,qty:qty});
    });
    if(parsed.length===0){ document.getElementById("mcStat").innerHTML='<span class="err">No valid data. Format: SKU qty</span>'; return; }
    var added=0, estCount=0, missCount=0;
    parsed.forEach(function(p){
      var spec = PACK_SPECS[p.sku];
      if(!spec){
        var est = estimatePackSpec(p.sku);
        if(est){ PACK_SPECS[p.sku]=est; S.packSpecs=PACK_SPECS; saveState(); spec=est; estCount++; }
        else{ missCount++; return; }
      }
      if(spec.source==="est"||!spec.source) estCount++;
      var boxes=Math.ceil(p.qty/spec.qty_per_box);
      var gw=boxes*spec.gw_per_box;
      var cbm=boxes*(spec.box_l*spec.box_w*spec.box_h)/1000000;
      var name=spec.spu||(GC[p.sku]?(GC[p.sku].name||GC[p.sku].en_name||""):"");
      MANIFEST.push({sku:p.sku,name:name,spec:(spec.box_l||"")+"x"+(spec.box_w||"")+"x"+(spec.box_h||"")+"cm",
        box_l:spec.box_l,box_w:spec.box_w,box_h:spec.box_h,qpb:spec.qty_per_box,qty:p.qty,
        boxes:boxes,gw:gw,cbm:cbm,source:spec.source||"manual"});
      added++;
    });
    document.getElementById("mcStat").innerHTML='<span class="ok">v Recognized '+added+' items'+(estCount>0?', '+estCount+' estimated':'')+(missCount>0?', '+missCount+' unmatched':'')+'</span>';
    maniSave(); _rPackCalc();
  };

  document.getElementById("mcAdd").onclick = function(){
    var sel=document.getElementById("mcSkuSel"); var sku=sel.value;
    var qty=parseInt(document.getElementById("mcQty").value);
    if(!sku||!qty||qty<1){ document.getElementById("mcStat").innerHTML='<span class="err">Select SKU and enter qty</span>'; return; }
    var spec=PACK_SPECS[sku];
    if(!spec){ document.getElementById("mcStat").innerHTML='<span class="err">SKU "'+sku+'" has no packing spec</span>'; return; }
    var boxes=Math.ceil(qty/spec.qty_per_box);
    var gw=boxes*spec.gw_per_box;
    var cbm=boxes*(spec.box_l*spec.box_w*spec.box_h)/1000000;
    var name=spec.spu||(GC[sku]?(GC[sku].name||GC[sku].en_name||""):"");
    MANIFEST.push({sku:sku,name:name,spec:(spec.box_l||"")+"x"+(spec.box_w||"")+"x"+(spec.box_h||"")+"cm",
      box_l:spec.box_l,box_w:spec.box_w,box_h:spec.box_h,qpb:spec.qty_per_box,qty:qty,
      boxes:boxes,gw:gw,cbm:cbm,source:spec.source||"manual"});
    document.getElementById("mcStat").innerHTML='<span class="ok">v Added '+sku+'</span>';
    maniSave(); _rPackCalc();
  };

  document.querySelectorAll("[data-mdel]").forEach(function(b){
    b.onclick=function(){ MANIFEST.splice(parseInt(this.dataset.mdel),1); maniSave(); _rPackCalc(); };
  });
  document.querySelectorAll("[data-mdelm]").forEach(function(b){
    b.onclick=function(){ MANI_MANUAL_MIXES.splice(parseInt(this.dataset.mdelm),1); maniSave(); _rPackCalc(); };
  });

  document.getElementById("mcClear").onclick=function(){
    if(MANIFEST.length===0 && MANI_MANUAL_MIXES.length===0) return;
    if(!confirm("Clear manifest?")) return;
    MANIFEST=[]; MANI_MANUAL_MIXES=[]; maniSave(); _rPackCalc();
  };

  // 自动混装余数 开关
  document.getElementById("mcAutoMix").onchange=function(){ MANI_AUTOMIX=this.checked; maniSave(); _rPackCalc(); };
  // 混装箱外箱尺寸（A 可改；留空/重置回到 B 自动取最大箱型）
  function syncMixDims(){ var L=+document.getElementById("mcMixL").value||0, W=+document.getElementById("mcMixW").value||0, H=+document.getElementById("mcMixH").value||0;
    if(L>0&&W>0&&H>0){ MANI_MIX_DIMS={l:L,w:W,h:H}; } else { MANI_MIX_DIMS=null; } maniSave(); _rPackCalc(); }
  ["mcMixL","mcMixW","mcMixH"].forEach(function(id){ document.getElementById(id).onchange=syncMixDims; });
  document.getElementById("mcMixReset").onclick=function(){ MANI_MIX_DIMS=null; maniSave(); _rPackCalc(); };
  // 手动合并（高级）：勾选若干 SKU -> 并入 1 个手动混装箱
  document.getElementById("mcMerge").onclick=function(){
    var sel=Array.from(document.querySelectorAll("[data-mchk]:checked")).map(function(c){return parseInt(c.dataset.mchk);});
    sel=sel.filter(function(v,i,a){return a.indexOf(v)===i;});
    if(sel.length<1){ document.getElementById("mcMergeHint").innerHTML='<span class="err">请先勾选左侧清单中的 SKU 行</span>'; return; }
    var mix=[];
    sel.forEach(function(idx){ var r=MANIFEST[idx]; if(!r) return; mix.push({sku:r.sku,name:r.name,qty:r.qty,unitW:manUnitW(r),unitVol:manUnitVol(r)}); });
    if(mix.length===0) return;
    var dims=manDims(manPool());
    MANI_MANUAL_MIXES.push({mix:mix,box_l:dims.l,box_w:dims.w,box_h:dims.h});
    sel.sort(function(a,b){return b-a;}).forEach(function(idx){ MANIFEST.splice(idx,1); });  // 已从 MANIFEST 移除，避免重复计
    maniSave();
    document.getElementById("mcMergeHint").innerHTML='<span class="ok">v 已合并 '+mix.length+' 个 SKU 为 1 个手动混装箱</span>';
    _rPackCalc();
  };

  document.getElementById("mcFeedTob").onclick=function(){
    if(MANIFEST.length===0){ document.getElementById("mcStat").innerHTML='<span class="err">Empty manifest</span>'; return; }
    window.__FEED_TOB={weight:MANI_TOTAL_GW,chargeWt:chargeWt,cbm:MANI_TOTAL_CBM,boxes:MANI_TOTAL_BOXES,divisor:MANI_DIVISOR,vw:MANI_TOTAL_VW};
    document.getElementById("mcStat").innerHTML='<span class="ok">v Fed to Tab 4 toB!</span>';
    CUR="tob"; render();
  };

  document.getElementById("mcFeedRoute").onclick=function(){
    if(MANIFEST.length===0){ document.getElementById("mcStat").innerHTML='<span class="err">Empty manifest</span>'; return; }
    window.__FEED_ROUTE={weight:MANI_TOTAL_GW,chargeWt:chargeWt,cbm:MANI_TOTAL_CBM,boxes:MANI_TOTAL_BOXES};
    document.getElementById("mcStat").innerHTML='<span class="ok">v Fed to Tab 6 Route!</span>';
    CUR="route"; render();
  };
}

function calcManifest(){
  MANI_VIEW=buildManView();
  MANI_TOTAL_BOXES=0; MANI_TOTAL_GW=0; MANI_TOTAL_CBM=0; MANI_TOTAL_VW=0; MANI_TOTAL_CW=0; MANI_MIN_BOX_TRIGGERED=0;
  MANI_VIEW.forEach(function(r){
    MANI_TOTAL_BOXES+=r.boxes;
    MANI_TOTAL_GW+=r.gw;
    MANI_TOTAL_CBM+=r.cbm;
    var vwBox=(r.box_l*r.box_w*r.box_h)/MANI_DIVISOR;
    var gwBox=r.gw/(r.boxes||1);
    var cwBox=Math.max(gwBox, vwBox);            // 单箱计费重 = MAX(单箱实重, 单箱体积重)
    if(cwBox < MANI_MIN_BOX_KG){ cwBox=MANI_MIN_BOX_KG; MANI_MIN_BOX_TRIGGERED+=r.boxes; }  // 尾程快递一箱最低收费
    MANI_TOTAL_CW += cwBox * r.boxes;
    MANI_TOTAL_VW+=(r.box_l*r.box_w*r.box_h*r.boxes)/MANI_DIVISOR;
  });
}

</script>

<div id="ver" style="position:fixed;bottom:4px;right:8px;font-size:10px;color:var(--mut2);opacity:0.8;cursor:pointer" title="强刷：Ctrl+Shift+R (Win) / Cmd+Shift+R (Mac)">build …</div>
<script>
(function(){
  var el=document.getElementById('ver');
  if(!el) return;
  if(typeof fetch==='function') fetch('version.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;})
    .then(function(j){ if(j&&j.build) el.textContent='build '+j.build; else el.textContent='build ?'; })
    .catch(function(){ el.textContent='build ??'; });
})();
</script></body>
</html>
