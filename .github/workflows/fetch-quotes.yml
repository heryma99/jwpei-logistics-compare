name: 定时抓报价单 -> 自动更新基础价格 + 飞书通知
# 触发：每天 09:00/14:00/18:00 (UTC+8 = 01/06/10 UTC) 自动；或手动 workflow_dispatch
# 动作：用 wl02@ 的 user_access_token 搜飞书邮箱报价单 -> 下附件 -> 解析
#      -> 只改 rates.json 基础价格数值 -> 重新烘焙 rates.js -> 飞书群推「变了什么」卡片
#      缺 WL02_MAIL_TOKEN secret 时安全跳过（不报错）。
on:
  schedule:
    - cron: "0 1,6,10 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fetch-quotes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装中文字体（环比快照图渲染需要）
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: 安装依赖
        run: python -m pip install --quiet openpyxl pynacl pillow
      - name: 抓取并解析报价单（只改价格数值 + 白名单校验）
        env:
          WL02_MAIL_TOKEN: ${{ secrets.WL02_MAIL_TOKEN }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FETCH_DIAG: ${{ secrets.FETCH_DIAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
        run: python .github/scripts/fetch_quotes.py
      - name: 提交价格变动（[skip ci] 避免重复触发 sync-rates 发卡片）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add rates.json rates.js version.json
          if git diff --cached --quiet; then
            echo "无价格变动，跳过提交"
          else
            git commit -m "chore: 自动抓单更新基础价格 [skip ci]"
            git push
          fi
