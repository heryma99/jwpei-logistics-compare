name: 配置中心改价 -> 自动烘焙 rates.js + 飞书通知
# 触发：团队在配置中心网页改 rates.json (push 到 main) 时自动跑
# 动作：用最新 rates.json 重新生成 rates.js + bump version.json，回推 main -> Pages 自动重建
#       + 向飞书群推送「报价已更新」卡片（含变更明细：更新人/时间/哪些渠道价格变了）
on:
  push:
    branches: [main]
    paths: ['rates.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bake-rates
  cancel-in-progress: false
jobs:
  bake-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 烘焙 rates.js (rates.json -> rates.js + version.json)
        run: python .github/scripts/bake_ratesjs.py
      - name: 提交并推送 (触发 Pages 自动重建)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add rates.js version.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动烘焙 rates.js（配置中心 rates.json 变更）[skip ci]"
            git push
          fi
      - name: 飞书群通知（报价更新 + 变更明细）
        env:
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_CHAT_ID: oc_cd9a6f072cdd348a08c29d09e8c9143a
          COMMITTER: ${{ github.event.head_commit.author.name }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/notify_feishu.py
