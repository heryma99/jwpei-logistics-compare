<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报价环比分析</title>
<style>
  :root{ --bg:#0e1117; --card:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e;
         --acc:#58a6ff; --up:#f85149; --down:#3fb950; --flat:#8b949e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding:16px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:12px;min-height:520px}
  .side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;overflow-y:auto;max-height:calc(100vh - 120px)}
  .allbtn{display:inline-block;font-size:12px;color:var(--acc);cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:8px;margin:2px 4px 8px}
  .allbtn.on{background:var(--acc);color:#0e1117;font-weight:600}
  .ct{font-size:12px;font-weight:700;color:var(--mut);padding:8px 10px 4px;cursor:pointer}
  .ct.on{color:var(--acc)}
  .cr{padding:5px 10px 5px 20px;font-size:13px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
  .cr:hover{background:#1c2533}
  .cr .cnt{font-size:11px;color:var(--mut);font-weight:400}
  .ch{padding:6px 10px 6px 34px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:8px;margin:2px 0}
  .ch:hover{background:#1c2533}
  .ch.on{background:#1a304d;color:var(--acc);font-weight:600}
  .badge{font-size:10px;color:var(--mut);background:#0e1117;border:1px solid var(--line);padding:1px 6px;border-radius:4px;white-space:nowrap}
  .detail{min-height:400px}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
  .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .dname{font-size:17px;font-weight:700}
  .dcar{font-size:12px;color:var(--mut);margin-top:2px}
  .dtag{font-size:11px;border-radius:6px;padding:2px 8px;background:#0e1117;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
  .sech{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
  .sech h3{font-size:13px;margin:0 0 8px;color:var(--acc);font-weight:600}
  .sech .ctx{font-size:12px;color:var(--mut);margin-bottom:8px}
  .histctrl{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .histctrl select{background:#0e1117;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;max-width:260px}
  .chips{display:flex;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
  .chip{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
  .chip.up{background:rgba(248,81,73,.15);color:var(--up)}
  .chip.down{background:rgba(63,185,80,.15);color:var(--down)}
  .chip.flat{background:rgba(139,148,158,.15);color:var(--flat)}
  .chip.na{background:rgba(139,148,158,.1);color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th:nth-child(2),td:nth-child(2){text-align:left}
  thead th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
  .up{color:var(--up);font-weight:600}
  .down{color:var(--down);font-weight:600}
  .flat{color:var(--flat)}
  .placeholder{color:var(--mut);padding:40px 20px;text-align:center}
  .note{color:var(--mut);font-size:12px;margin-top:18px;line-height:1.6}
  code{background:var(--card);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .side{max-height:none;position:static}
  }
</style>
</head>
<body>
<h1>📊 报价环比分析</h1>
<div class="sub" id="sub">加载中…</div>

<div class="layout">
  <aside class="side" id="sidebar"></aside>
  <main class="detail" id="detail"></main>
</div>

<div class="note">
  交互：左侧 <b>树形导航</b> —— 点「全部」展开所有物流商与其渠道；点某个<b>分类</b>（小包专线 / 商业快递 / to B 头程）收拢到该分类；点<b>物流商</b>展开/收起其渠道；点<b>渠道</b>，右侧出它的明细。<br>
  右侧明细含两块：① <b>最新环比</b>（上一期 → 本期，逐目的国/分区 × 重量段）；② <b>历史对比</b>下拉，选任意已有报价日期，立即算「最新价 vs 该日」逐段涨跌。<br>
  红＝涨价，绿＝降价，灰＝持平。数据来源 <code>versions.json</code>，已含系统里全部历史报价版本。
</div>

<script>
const params = new URLSearchParams(location.search);
const EMBED = params.get("embed") === "1";
if (EMBED) {
  document.querySelector("h1").style.display = "none";
  document.querySelector(".note").style.display = "none";
  document.body.style.padding = "8px";
}

let VERS = [];
let LATEST = null;          // 最新版本（当前价）
let TREE = {};              // cat -> carrier -> [cid]
let CATS = [];              // 分类顺序
let CAT_LABEL = {small:"小包专线", express:"商业快递", "b2b-air":"to B 头程", overseas:"海外仓"};
let filterCat = null;       // null=全部
let collapsed = new Set();  // 收起的物流商 key（cat||carrier）
let curId = null;

function catLabel(c){ return CAT_LABEL[c] || c; }

fetch("versions.json?_=" + Date.now(), {cache:"no-store"})
  .then(r => r.json())
  .then(d => {
    VERS = (d.versions || []).slice().sort((a,b) => a.date.localeCompare(b.date));
    LATEST = VERS[VERS.length - 1];
    buildTree();
    document.getElementById("sub").textContent =
      `共 ${VERS.length} 个报价版本（${VERS[0].date} ~ ${LATEST.date}）｜ 当前价基准 ${LATEST.date}`;
    // 默认选中第一个渠道
    const first = firstChannelId();
    if (first) selectChannel(first);
    else document.getElementById("detail").innerHTML = '<div class="placeholder">无渠道数据</div>';
  })
  .catch(e => { document.getElementById("sub").textContent = "加载 versions.json 失败：" + e; });

function buildTree(){
  TREE = {};
  for (const [cid, ch] of Object.entries(LATEST.channels)){
    const cat = ch.cat || "other";
    (TREE[cat] = TREE[cat] || {});
    (TREE[cat][ch.carrier] = TREE[cat][ch.carrier] || []).push(cid);
  }
  CATS = Object.keys(TREE).sort((a,b) => (CAT_LABEL[a]||a).localeCompare(CAT_LABEL[b]||b,'zh'));
  renderTree();
}

function firstChannelId(){
  for (const cat of CATS){
    if (filterCat && cat !== filterCat) continue;
    const cars = Object.keys(TREE[cat]);
    if (cars.length) return TREE[cat][cars[0]][0];
  }
  return null;
}

function renderTree(){
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";

  const allBtn = document.createElement("span");
  allBtn.className = "allbtn" + (filterCat === null ? " on" : "");
  allBtn.textContent = "全部";
  allBtn.onclick = () => { filterCat = null; renderTree(); };
  sb.appendChild(allBtn);

  const cats = filterCat ? [filterCat] : CATS;
  for (const cat of cats){
    if (!TREE[cat]) continue;
    const ct = document.createElement("div");
    ct.className = "ct" + (filterCat === cat ? " on" : "");
    const catCount = Object.values(TREE[cat]).reduce((s,a)=>s+a.length,0);
    ct.textContent = `${catLabel(cat)} (${catCount})`;
    ct.onclick = () => { filterCat = (filterCat === cat ? null : cat); renderTree(); };
    sb.appendChild(ct);

    for (const car of Object.keys(TREE[cat]).sort((a,b)=>a.localeCompare(b,'zh'))){
      const ckey = cat + "||" + car;
      const cr = document.createElement("div");
      cr.className = "cr";
      cr.innerHTML = `<span>${car}</span><span class="cnt">${TREE[cat][car].length}</span>`;
      cr.onclick = () => { if (collapsed.has(ckey)) collapsed.delete(ckey); else collapsed.add(ckey); renderTree(); if (curId) selectChannel(curId); };
      sb.appendChild(cr);

      if (collapsed.has(ckey)) continue;
      for (const cid of TREE[cat][car]){
        const ch = LATEST.channels[cid];
        const {up,down} = channelChange(cid);
        const div = document.createElement("div");
        div.className = "ch" + (cid === curId ? " on" : "");
        const badge = (up||down) ? `涨${up} 跌${down}` : "持平";
        div.innerHTML = `<span>${ch.name}</span><span class="badge">${badge}</span>`;
        div.onclick = () => selectChannel(cid);
        sb.appendChild(div);
      }
    }
  }
}

// 某渠道相对「上一期」的涨跌计数（用于左侧 badge）
function channelChange(cid){
  const prev = VERS.length >= 2 ? (VERS[VERS.length-2].channels[cid] || {}).rows : null;
  const cur = (LATEST.channels[cid] || {}).rows;
  let up=0,down=0;
  if (prev && cur){
    const pm = {};
    prev.forEach(r => pm[r.dim+"|"+r.w] = r.rate);
    cur.forEach(r => { const pv = pm[r.dim+"|"+r.w]; if (pv==null) return; const d=r.rate-pv; if(d>0)up++; else if(d<0)down++; });
  }
  return {up,down};
}

function selectChannel(cid){
  curId = cid;
  // 高亮
  [...document.getElementById("sidebar").querySelectorAll(".ch")].forEach(x => x.classList.remove("on"));
  // 重新渲染树以更新高亮 + 明细
  renderTree();
  renderDetail(cid);
}

function joinRows(baseRows, curRows){
  const pm = {};
  (baseRows||[]).forEach(r => pm[r.dim+"|"+r.w] = r.rate);
  return (curRows||[]).map(r => {
    const pv = pm[r.dim+"|"+r.w];
    let d=null, dir="flat";
    if (pv != null){ d = +(r.rate - pv).toFixed(2); dir = d>0?"up":(d<0?"down":"flat"); }
    return {dim:r.dim, w:r.w, prev:pv, cur:r.rate, d, dir};
  });
}

function tableHTML(rows){
  let html = `<table><thead><tr><th>目的国/分区</th><th>重量段</th><th>上期</th><th>本期</th><th>Δ</th><th>方向</th></tr></thead><tbody>`;
  if (!rows.length){ html += `<tr><td colspan="6" style="text-align:center;color:var(--mut)">该渠道在此对比版本中无数据</td></tr>`; }
  rows.forEach(r => {
    const prevTxt = r.prev==null ? "—" : r.prev;
    const dTxt = r.d==null ? "—" : (r.d>0?"+":"")+r.d;
    const dirTxt = r.dir==="up"?"▲ 涨":r.dir==="down"?"▼ 跌":"＝ 持平";
    html += `<tr><td>${r.dim}</td><td>${r.w}</td><td>${prevTxt}</td><td>${r.cur}</td><td class="${r.dir}">${dTxt}</td><td class="${r.dir}">${dirTxt}</td></tr>`;
  });
  return html + `</tbody></table>`;
}

function chipsHTML(rows){
  let up=0,down=0,flat=0,na=0;
  rows.forEach(r => { if(r.dir==="up")up++; else if(r.dir==="down")down++; else if(r.prev==null)na++; else flat++; });
  return `<div class="chips">`+
    `<span class="chip up">▲ 涨 ${up}</span>`+
    `<span class="chip down">▼ 跌 ${down}</span>`+
    `<span class="chip flat">＝ 持平 ${flat}</span>`+
    (na?`<span class="chip na">· 仅本期 ${na}</span>`:"")+`</div>`;
}

function renderDetail(cid){
  const det = document.getElementById("detail");
  const ch = LATEST.channels[cid];
  if (!ch){ det.innerHTML = '<div class="placeholder">请选择左侧渠道</div>'; return; }

  const prevIdx = Math.max(0, VERS.length - 2);
  const baseRows0 = (VERS[prevIdx].channels[cid] || {}).rows || null;
  const curRows = ch.rows;
  const rowsMoM = joinRows(baseRows0, curRows);

  let html = `<div class="dcard">`;
  html += `<div class="dhead"><div><div class="dname">${ch.name}</div>`+
          `<div class="dcar">${ch.carrier} · ${catLabel(ch.cat)}</div></div>`+
          `<span class="dtag">${ch.cat}</span></div>`;

  // ① 最新环比
  html += `<div class="sech"><h3>最新环比</h3>`+
          `<div class="ctx">上一期 ${VERS[prevIdx].date} → 本期 ${LATEST.date}</div>`+
          chipsHTML(rowsMoM) + tableHTML(rowsMoM) + `</div>`;

  // ② 历史对比
  html += `<div class="sech"><h3>历史对比</h3>`+
          `<div class="histctrl"><span class="ctx" style="margin:0">选一个历史报价日期，看最新价 vs 该日逐段涨跌：</span>`+
          `<select id="selHist"></select></div>`+
          `<div id="histBody"></div></div>`;

  html += `</div>`;
  det.innerHTML = html;

  // 历史下拉：除当前外所有版本
  const sel = document.getElementById("selHist");
  const histVers = VERS.map((v,i)=>({v,i})).filter(x => x.i !== VERS.length-1);
  histVers.forEach(({v,i}) => {
    const opt = new Option(v.date + (i===prevIdx ? "（上一期）" : ""), i);
    sel.appendChild(opt);
  });
  sel.value = prevIdx;
  sel.onchange = () => renderHistory(cid, +sel.value);
  renderHistory(cid, prevIdx);
}

function renderHistory(cid, baseIdx){
  const body = document.getElementById("histBody");
  if (!body) return;
  const baseRows = (VERS[baseIdx].channels[cid] || {}).rows || null;
  const curRows = (LATEST.channels[cid] || {}).rows;
  const rows = joinRows(baseRows, curRows);
  body.innerHTML = `<div class="ctx">最新价（${LATEST.date}） vs ${VERS[baseIdx].date}</div>` +
                   chipsHTML(rows) + tableHTML(rows);
}
</script>
</body>
</html>
