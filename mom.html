<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报价环比分析</title>
<style>
  :root{ --bg:#0e1117; --card:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e;
         --acc:#58a6ff; --up:#f85149; --down:#3fb950; --flat:#8b949e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding:16px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:12px}

  .topbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .mbtn{font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);user-select:none}
  .mbtn:hover{border-color:var(--acc)}
  .mbtn.on{background:var(--acc);color:#0e1117;font-weight:600;border-color:var(--acc)}

  .layout{display:grid;grid-template-columns:300px 1fr;gap:12px;min-height:520px}
  .side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;overflow-y:auto;max-height:calc(100vh - 160px)}
  .ctlabel{font-size:12px;font-weight:700;color:var(--mut);padding:10px 10px 4px}
  .car{padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-radius:8px;margin:2px 0}
  .car:hover{background:#1c2533}
  .car .arw{color:var(--mut);width:14px;display:inline-block;font-weight:400}
  .car .cnt{font-size:11px;color:var(--mut);font-weight:400}
  .ch{padding:6px 10px 6px 34px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:8px;margin:2px 0}
  .ch:hover{background:#1c2533}
  .ch.on{background:#1a304d;color:var(--acc);font-weight:600}
  .badge{font-size:10px;color:var(--mut);background:#0e1117;border:1px solid var(--line);padding:1px 6px;border-radius:4px;white-space:nowrap}
  .detail{min-height:400px}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
  .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .dname{font-size:17px;font-weight:700}
  .dcar{font-size:12px;color:var(--mut);margin-top:2px}
  .dtag{font-size:11px;border-radius:6px;padding:2px 8px;background:#0e1117;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
  .histctrl{display:flex;gap:8px;align-items:center;margin:10px 0 12px;flex-wrap:wrap}
  .histctrl label{font-size:13px;color:var(--mut)}
  .histctrl select{background:#0e1117;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;max-width:320px}
  .chips{display:flex;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
  .chip{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
  .chip.up{background:rgba(248,81,73,.15);color:var(--up)}
  .chip.down{background:rgba(63,185,80,.15);color:var(--down)}
  .chip.flat{background:rgba(139,148,158,.15);color:var(--flat)}
  .chip.na{background:rgba(139,148,158,.1);color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th:nth-child(2),td:nth-child(2){text-align:left}
  thead th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
  .up{color:var(--up);font-weight:600}
  .down{color:var(--down);font-weight:600}
  .flat{color:var(--flat)}
  .placeholder{color:var(--mut);padding:40px 20px;text-align:center;line-height:1.8}
  .note{color:var(--mut);font-size:12px;margin-top:18px;line-height:1.6}
  code{background:var(--card);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .side{max-height:none;position:static}
  }
</style>
</head>
<body>
<h1>📊 报价环比分析</h1>
<div class="sub" id="sub">加载中…</div>

<div class="topbar" id="topbar"></div>

<div class="layout">
  <aside class="side" id="sidebar"></aside>
  <main class="detail" id="detail"></main>
</div>

<div class="note">
  交互：顶部 <b>并排大菜单</b> 选分类（全部 / 小包专线 / 商业快递 / TO B头程 / 海外仓）—— 点分类后，左侧物流商<b>默认全部折叠</b>，点开某个物流商才展开它的渠道；点<b>渠道</b>，右侧出明细。<br>
  右侧明细只有一个 <b>对比基准日</b> 下拉：它列出<b>该渠道自己真实的历史报价日</b>（各家、各渠道的报价到达时间不同，互不相同）。默认「上一期」即<b>最新环比</b>；选任意历史报价日，同一张表立刻重算「最新价 vs 该日」的逐段涨跌（即基期/历史比价）。<br>
  红＝涨价，绿＝降价，灰＝持平。数据来源 <code>versions.json</code>，按邮箱真实报价日重建的逐渠道历史快照。
</div>

<script>
const params = new URLSearchParams(location.search);
const EMBED = params.get("embed") === "1";
if (EMBED) {
  document.querySelector("h1").style.display = "none";
  document.querySelector(".note").style.display = "none";
  document.body.style.padding = "8px";
}

let CH = {};               // cid -> {cat, name, carrier, snapshots:[{date, rows:[{dim,w,rate}]}]}
let LATEST = null;         // 最新价视图：{channels:{cid:{...,rows:[...]}}}
let LATEST_DATE = null;    // 当前价基准日期
let TREE = {};             // cat -> carrier -> [cid]
let CATS = [];             // 分类顺序
let CAT_LABEL = {small:"小包专线", express:"商业快递", "b2b-air":"to B 头程", overseas:"海外仓"};
let MENU = [
  {key:null, label:"全部"},
  {key:"small", label:"小包专线"},
  {key:"express", label:"商业快递"},
  {key:"b2b-air", label:"TO B头程"},
  {key:"overseas", label:"海外仓"},
];
let filterCat = null;       // null=全部；"overseas"=占位
let expanded = new Set();   // 展开的物流商 key（cat||carrier）；默认空=全折叠
let curId = null;

function catLabel(c){ return CAT_LABEL[c] || c; }

fetch("versions.json?_=" + Date.now(), {cache:"no-store"})
  .then(r => r.json())
  .then(d => {
    CH = d.channels || {};
    LATEST_DATE = d.latestDate || "";
    // 构建「最新价视图」：每个渠道取末位 snapshot 的 rows 作为当前价
    LATEST = {channels:{}};
    for (const [cid, ch] of Object.entries(CH)){
      const snaps = (ch.snapshots || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
      const cur = snaps[snaps.length - 1];
      LATEST.channels[cid] = Object.assign({}, ch, {rows: cur ? cur.rows : []});
    }
    buildTree();
    renderTopbar();
    // 全局统计
    let allDates = new Set(), withHist = 0;
    for (const cid in CH){
      const s = CH[cid].snapshots || [];
      s.forEach(x => allDates.add(x.date));
      if (s.length > 1) withHist++;
    }
    const dates = [...allDates].sort();
    document.getElementById("sub").textContent =
      `共 ${Object.keys(CH).length} 个渠道｜ 有历史报价的 ${withHist} 个｜ 报价日期跨度 ${dates[0]} ~ ${dates[dates.length-1]}｜ 当前价基准 ${LATEST_DATE}`;
    renderTree();
    document.getElementById("detail").innerHTML =
      '<div class="placeholder">← 从左侧点开一个物流商，再点它的渠道<br>即可查看该渠道按真实报价日的环比比价</div>';
  })
  .catch(e => { document.getElementById("sub").textContent = "加载 versions.json 失败：" + e; });

function buildTree(){
  TREE = {};
  for (const [cid, ch] of Object.entries(LATEST.channels)){
    const cat = ch.cat || "other";
    (TREE[cat] = TREE[cat] || {});
    (TREE[cat][ch.carrier] = TREE[cat][ch.carrier] || []).push(cid);
  }
  CATS = Object.keys(TREE).sort((a,b) => (CAT_LABEL[a]||a).localeCompare(CAT_LABEL[b]||b,'zh'));
}

function renderTopbar(){
  const tb = document.getElementById("topbar");
  tb.innerHTML = "";
  MENU.forEach(m => {
    const b = document.createElement("span");
    b.className = "mbtn" + (filterCat === m.key ? " on" : "");
    b.textContent = m.label;
    b.onclick = () => {
      filterCat = m.key;
      if (m.key === "overseas"){ curId = null; document.getElementById("detail").innerHTML =
        '<div class="placeholder">海外仓暂无对比渠道<br><span style="font-size:12px">系统在比价数据里尚未接入海外仓报价</span></div>'; }
      renderTopbar();
      renderTree();
    };
    tb.appendChild(b);
  });
}

function renderTree(){
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";

  if (filterCat === "overseas"){
    sb.innerHTML = '<div class="placeholder">海外仓暂无对比渠道<br><span style="font-size:12px">系统在比价数据里尚未接入海外仓报价</span></div>';
    return;
  }

  const cats = filterCat ? [filterCat] : CATS;
  for (const cat of cats){
    if (!TREE[cat]) continue;
    if (!filterCat){
      const h = document.createElement("div");
      h.className = "ctlabel";
      h.textContent = catLabel(cat);
      sb.appendChild(h);
    }
    for (const car of Object.keys(TREE[cat]).sort((a,b)=>a.localeCompare(b,'zh'))){
      const ckey = cat + "||" + car;
      const isOpen = expanded.has(ckey);
      const cr = document.createElement("div");
      cr.className = "car";
      cr.innerHTML = `<span><span class="arw">${isOpen?"▾":"▸"}</span> ${car}</span><span class="cnt">${TREE[cat][car].length}</span>`;
      cr.onclick = () => { if (expanded.has(ckey)) expanded.delete(ckey); else expanded.add(ckey); renderTree(); };
      sb.appendChild(cr);

      if (!isOpen) continue;
      for (const cid of TREE[cat][car]){
        const ch = LATEST.channels[cid];
        const {up,down} = channelChange(cid);
        const div = document.createElement("div");
        div.className = "ch" + (cid === curId ? " on" : "");
        const badge = (up||down) ? `涨${up} 跌${down}` : "持平";
        div.innerHTML = `<span>${ch.name}</span><span class="badge">${badge}</span>`;
        div.onclick = () => selectChannel(cid);
        sb.appendChild(div);
      }
    }
  }
}

// 某渠道相对「上一期」的涨跌计数（用于左侧 badge），取该渠道末两份快照
function channelChange(cid){
  const s = (CH[cid].snapshots || []);
  if (s.length < 2) return {up:0,down:0};
  const prev = s[s.length - 2].rows, cur = s[s.length - 1].rows;
  let up=0,down=0;
  const pm = {};
  prev.forEach(r => pm[r.dim+"|"+r.w] = r.rate);
  cur.forEach(r => { const pv = pm[r.dim+"|"+r.w]; if (pv==null) return; const d=r.rate-pv; if(d>0)up++; else if(d<0)down++; });
  return {up,down};
}

function selectChannel(cid){
  curId = cid;
  // 确保所属物流商展开，使高亮可见
  for (const cat of CATS){
    if (TREE[cat]){
      for (const car of Object.keys(TREE[cat])){
        if (TREE[cat][car].includes(cid)) expanded.add(cat + "||" + car);
      }
    }
  }
  renderTree();
  renderDetail(cid);
}

function joinRows(baseRows, curRows){
  const pm = {};
  (baseRows||[]).forEach(r => pm[r.dim+"|"+r.w] = r.rate);
  return (curRows||[]).map(r => {
    const pv = pm[r.dim+"|"+r.w];
    let d=null, dir="flat";
    if (pv != null){ d = +(r.rate - pv).toFixed(2); dir = d>0?"up":(d<0?"down":"flat"); }
    return {dim:r.dim, w:r.w, prev:pv, cur:r.rate, d, dir};
  });
}

function fmtPrice(v){ return v==null || v==="" ? "—" : (+v).toFixed(2); }

function tableHTML(rows){
  let html = `<table><thead><tr><th>目的国/分区</th><th>重量段</th><th>最新价</th><th>对比价</th><th>Δ</th><th>方向</th></tr></thead><tbody>`;
  if (!rows.length){ html += `<tr><td colspan="6" style="text-align:center;color:var(--mut)">该渠道在此对比版本中无数据</td></tr>`; }
  rows.forEach(r => {
    const curTxt = fmtPrice(r.cur);
    const prevTxt = fmtPrice(r.prev);
    const dTxt = r.d==null ? "—" : (r.d>0?"+":"")+r.d;
    const dirTxt = r.dir==="up"?"▲ 涨":r.dir==="down"?"▼ 跌":"＝ 持平";
    html += `<tr><td>${r.dim}</td><td>${r.w}</td><td>${curTxt}</td><td>${prevTxt}</td><td class="${r.dir}">${dTxt}</td><td class="${r.dir}">${dirTxt}</td></tr>`;
  });
  return html + `</tbody></table>`;
}

function chipsHTML(rows){
  let up=0,down=0,flat=0,na=0;
  rows.forEach(r => { if(r.dir==="up")up++; else if(r.dir==="down")down++; else if(r.prev==null)na++; else flat++; });
  return `<div class="chips">`+
    `<span class="chip up">▲ 涨 ${up}</span>`+
    `<span class="chip down">▼ 跌 ${down}</span>`+
    `<span class="chip flat">＝ 持平 ${flat}</span>`+
    (na?`<span class="chip na">· 仅最新 ${na}</span>`:"")+`</div>`;
}

function renderDetail(cid){
  const det = document.getElementById("detail");
  const ch = LATEST.channels[cid];
  if (!ch){ det.innerHTML = '<div class="placeholder">请选择左侧渠道</div>'; return; }

  const s = (CH[cid].snapshots || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const lastIdx = s.length - 1;

  let html = `<div class="dcard">`;
  html += `<div class="dhead"><div><div class="dname">${ch.name}</div>`+
          `<div class="dcar">${ch.carrier} · ${catLabel(ch.cat)}</div></div>`+
          `<span class="dtag">${ch.cat}</span></div>`;

  if (s.length < 2){
    html += `<div class="placeholder">该渠道暂无历史报价（仅最新价 ${LATEST_DATE}）<br>`+
            `<span style="font-size:12px">邮箱里没有抓到这家该渠道的早期报价单，无法做环比</span></div>`;
    html += `</div>`;
    det.innerHTML = html;
    return;
  }

  // 单一对比区块：下拉列出该渠道自己的实际报价日
  html += `<div class="histctrl"><label>对比基准日</label><select id="selBase"></select></div>`;
  html += `<div id="cmpBody"></div>`;
  html += `</div>`;
  det.innerHTML = html;

  const sel = document.getElementById("selBase");
  const prevIdx = lastIdx - 1;
  s.forEach((snap, i) => {
    if (i === lastIdx) return;            // 末位是最新价本身，不进下拉
    const opt = new Option(snap.date + (i===prevIdx ? "（上一期·最新环比）" : ""), i);
    sel.appendChild(opt);
  });
  sel.value = prevIdx;
  sel.onchange = () => renderCompare(cid, +sel.value);
  renderCompare(cid, prevIdx);
}

function renderCompare(cid, baseIdx){
  const body = document.getElementById("cmpBody");
  if (!body) return;
  const s = (CH[cid].snapshots || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const baseSnap = s[baseIdx], curSnap = s[s.length - 1];
  const baseRows = baseSnap.rows, curRows = curSnap.rows;
  const rows = joinRows(baseRows, curRows);
  const isPrev = (baseIdx === s.length - 2);
  const tag = isPrev ? "（最新环比：上一期 → 本期）" : "";
  body.innerHTML = `<div class="ctx" style="font-size:12px;color:var(--mut);margin-bottom:8px">最新价（${curSnap.date}） vs 对比基准 ${baseSnap.date} ${tag}</div>` +
                   chipsHTML(rows) + tableHTML(rows);
}
</script>
</body>
</html>
