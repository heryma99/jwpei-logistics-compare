<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报价环比分析</title>
<style>
  :root{ --bg:#0e1117; --card:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e;
         --acc:#58a6ff; --up:#f85149; --down:#3fb950; --flat:#8b949e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding:16px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  button.on{background:var(--acc);color:#0e1117;border-color:var(--acc);font-weight:600}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:12px;min-height:500px}
  .side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-y:auto;max-height:calc(100vh - 140px)}
  .gt{font-size:12px;font-weight:700;color:var(--mut);padding:8px 6px 2px}
  .gt2{font-size:12px;font-weight:600;color:var(--acc);padding:6px 8px 2px 18px;border-top:1px dashed var(--line);margin-top:6px}
  .ch{padding:7px 10px;font-size:13px;cursor:pointer;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin:3px 0;gap:8px}
  .ch:hover{background:#1c2533}
  .ch.on{background:#1a304d;color:var(--acc);font-weight:600}
  .chname{flex:1;min-width:0}
  .chname small{display:block;color:var(--mut);font-weight:400;font-size:11px}
  .badge{font-size:10px;color:var(--mut);background:#0e1117;border:1px solid var(--line);padding:1px 6px;border-radius:4px;white-space:nowrap}
  .detail{min-height:400px}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:0 1px 10px rgba(0,0,0,.12)}
  .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .dname{font-size:17px;font-weight:700}
  .dcar{font-size:12px;color:var(--mut);margin-top:2px}
  .dtag{font-size:11px;border-radius:6px;padding:2px 8px;background:#0e1117;border:1px solid var(--line);color:var(--mut)}
  .chips{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
  .chip{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
  .chip.up{background:rgba(248,81,73,.15);color:var(--up)}
  .chip.down{background:rgba(63,185,80,.15);color:var(--down)}
  .chip.flat{background:rgba(139,148,158,.15);color:var(--flat)}
  .chip.na{background:rgba(139,148,158,.1);color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th:nth-child(2),td:nth-child(2){text-align:left}
  thead th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
  .up{color:var(--up);font-weight:600}
  .down{color:var(--down);font-weight:600}
  .flat{color:var(--flat)}
  .placeholder{color:var(--mut);padding:40px 20px;text-align:center}
  .note{color:var(--mut);font-size:12px;margin-top:18px;line-height:1.6}
  code{background:var(--card);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .side{max-height:none;position:static}
  }
</style>
</head>
<body>
<h1>📊 报价环比分析</h1>
<div class="sub" id="sub">加载中…</div>

<div class="bar" id="catBar"></div>

<div class="layout">
  <aside class="side" id="sidebar"></aside>
  <main class="detail" id="detail"></main>
</div>

<div class="note">
  数据来源：<code>versions.json</code>（上一期 <b id="bD"></b> → 本期 <b id="cD"></b>）。<br>
  按业务域分组：<b>全部</b>（119 渠道）、<b>小包专线</b>（B2C 按件/按票）、<b>商业快递</b>（DHL/FedEx/UPS 分区总票价）、<b>2B头程</b>（FBA/专线头程）、<b>海外仓</b>（发往海外仓的头程/入仓渠道）。<br>
  红＝涨价，绿＝降价，灰＝持平。逐（目的国/分区 × 重量段）比对运费。谷仓等海外仓操作费对比数据源未接入（另见 overseas_data.js）。
</div>

<script>
const params = new URLSearchParams(location.search);
const EMBED = params.get("embed") === "1";
if (EMBED) {
  document.querySelector("h1").style.display = "none";
  document.querySelector(".note").style.display = "none";
  document.body.style.padding = "8px";
}

let DATA = null;
const isOverseas = (c) => /海外仓|入仓|集货仓/.test(c.name || "");
const catOf = (c) => isOverseas(c) ? "overseas" : (c.cat || "");
const normCarrier = (c) => {
  const n = c.carrier || "—";
  if (n.startsWith("云途")) return "云途";
  if (n.startsWith("亚丰")) return "亚丰";
  return n;
};
const DOMAINS = [["all","全部"],["small","小包专线"],["express","商业快递"],["b2b-air","2B头程"],["overseas","海外仓"]];
let curCat = "all";
let curId = null;

fetch("versions.json?_=" + Date.now(), {cache:"no-store"})
  .then(r => r.json())
  .then(d => { DATA = d; init(); })
  .catch(e => { document.getElementById("sub").textContent = "加载 versions.json 失败：" + e; });

function init(){
  document.getElementById("sub").textContent =
    `上一期 ${DATA.baseline.date}（${DATA.baseline.label}）→ 本期 ${DATA.current.date}（${DATA.current.label}）；共 ${Object.keys(DATA.channels).length} 渠道可比`;
  document.getElementById("bD").textContent = DATA.baseline.date;
  document.getElementById("cD").textContent = DATA.current.date;

  const bar = document.getElementById("catBar");
  DOMAINS.forEach(([cat,label]) => {
    const n = cat === "all" ? Object.keys(DATA.channels).length
            : Object.values(DATA.channels).filter(c => catOf(c) === cat).length;
    const b = document.createElement("button");
    b.textContent = label + " (" + n + ")"; b.dataset.c = cat;
    if (cat === curCat) b.classList.add("on");
    b.onclick = () => { curCat = cat; renderBar(); buildSidebar(); };
    bar.appendChild(b);
  });

  buildSidebar();
}

function renderBar(){
  [...document.getElementById("catBar").children].forEach(x => x.classList.toggle("on", x.dataset.c === curCat));
}

function joinRows(prev, cur){
  const pm = {};
  prev.forEach(r => pm[r.dim+"|"+r.w] = r.rate);
  const out = [];
  cur.forEach(r => {
    const pv = pm[r.dim+"|"+r.w];
    const rate = r.rate;
    let d = null, dir = "flat";
    if (pv != null){ d = +(rate - pv).toFixed(2); dir = d>0?"up":(d<0?"down":"flat"); }
    out.push({dim:r.dim, w:r.w, prev:pv, cur:rate, d, dir});
  });
  return out;
}

function buildSidebar(){
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";

  const all = Object.entries(DATA.channels).sort((a,b) => a[1].name.localeCompare(b[1].name,'zh'));

  // 第三步：渠道（按物流商分组渲染）
  const renderByCarrier = (list) => {
    const groups = {};
    list.forEach(([id,c]) => {
      const k = normCarrier(c);
      (groups[k] = groups[k] || []).push([id,c]);
    });
    Object.entries(groups).sort((a,b) => a[0].localeCompare(b[0],'zh')).forEach(([car,sub]) => {
      const g2 = document.createElement("div");
      g2.className = "gt2"; g2.textContent = car + " (" + sub.length + ")";
      sb.appendChild(g2);
      sub.forEach(([id,c]) => {
        const rows = joinRows(c.prev, c.cur);
        let up=0,down=0,flat=0,na=0;
        rows.forEach(r => { if(r.dir==="up")up++; else if(r.dir==="down")down++; else if(r.prev==null)na++; else flat++; });
        const badgeText = `涨${up} 跌${down} 平${flat}`;
        const div = document.createElement("div");
        div.className = "ch" + (id === curId ? " on" : "");
        div.innerHTML = `<span class="chname">${c.name}<small>${c.carrier}</small></span><span class="badge">${badgeText}</span>`;
        div.onclick = () => { curId = id; buildSidebar(); renderDetail(id); };
        sb.appendChild(div);
      });
    });
  };

  // 第一步：大类
  if (curCat === "all"){
    [["small","小包专线"],["express","商业快递"],["b2b-air","2B头程"],["overseas","海外仓"]].forEach(([cat,label]) => {
      const sub = all.filter(([id,c]) => catOf(c) === cat);
      if (!sub.length) return;
      const g = document.createElement("div");
      g.className = "gt"; g.textContent = label + " (" + sub.length + ")";
      sb.appendChild(g);
      renderByCarrier(sub);   // 第二步：物流商
    });
  } else {
    const chs = all.filter(([id,c]) => catOf(c) === curCat);
    if (!chs.length){ sb.innerHTML = '<div class="placeholder">无数据</div>'; return; }
    renderByCarrier(chs);
  }

  const pool = curCat === "all" ? all : all.filter(([id,c]) => catOf(c) === curCat);
  if (!curId || (curCat !== "all" && catOf(DATA.channels[curId] || {}) !== curCat)) curId = (pool[0]||[])[0];
  renderDetail(curId);
}

function renderDetail(id){
  const det = document.getElementById("detail");
  if (!id || !DATA.channels[id]){ det.innerHTML = '<div class="placeholder">请选择左侧渠道</div>'; return; }
  const c = DATA.channels[id];
  const rows = joinRows(c.prev, c.cur);
  let up=0,down=0,flat=0,na=0;
  rows.forEach(r => { if(r.dir==="up")up++; else if(r.dir==="down")down++; else if(r.prev==null)na++; else flat++; });

  const catLabel = ({small:"小包专线", express:"商业快递", "b2b-air":"2B头程", overseas:"海外仓"}[catOf(c)]) || catOf(c);

  let html = `<div class="dcard">`;
  html += `<div class="dhead"><div><div class="dname">${c.name}</div><div class="dcar">${c.carrier} · ${catLabel}</div></div><span class="dtag">${catOf(c)}</span></div>`;
  html += `<div class="chips">`+
    `<span class="chip up">▲ 涨 ${up}</span>`+
    `<span class="chip down">▼ 跌 ${down}</span>`+
    `<span class="chip flat">＝ 持平 ${flat}</span>`+
    (na?`<span class="chip na">· 仅本期 ${na}</span>`:"") +
    `</div>`;
  html += `<table><thead><tr><th>目的国/分区</th><th>重量段</th><th>上期 ¥/kg</th><th>本期 ¥/kg</th><th>Δ</th><th>方向</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const prevTxt = r.prev==null ? "—" : r.prev;
    const dTxt = r.d==null ? "—" : (r.d>0?"+":"")+r.d;
    const dirTxt = r.dir==="up"?"▲ 涨":r.dir==="down"?"▼ 跌":"＝ 持平";
    html += `<tr><td>${r.dim}</td><td>${r.w}</td><td>${prevTxt}</td><td>${r.cur}</td><td class="${r.dir}">${dTxt}</td><td class="${r.dir}">${dirTxt}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  det.innerHTML = html;
}
</script>
</body>
</html>
